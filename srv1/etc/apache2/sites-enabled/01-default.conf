#http://httpd.apache.org/docs/trunk/upgrading.html
<IfModule mod_ssl.c>
	<VirtualHost *:443>
	    SSLEngine on
            # SSLProtocol all
            SSLProtocol -all +TLSv1.2
            # SSLCipherSuite HIGH:MEDIUM
	    SSLCipherSuite HIGH
	    SSLOptions StrictRequire 
            SSLCertificateFile    /etc/ssl/crt/server/monital.crt
            SSLCertificateKeyFile /etc/ssl/crt/server/monital.rsa.key
	    AddType application/x-x509-ca-cert .crt
	    AddType application/x-pkcs7-crl    .crl
    	    DocumentRoot "/srv/www/home/srv1.metropol.com.br/"
    	    <Directory "/srv/www/home/srv1.metropol.com.br/">
        	SSLRequireSSL
		Require all granted
    	    </Directory>
            <FilesMatch "\.(cgi|shtml|phtml|php)$">
                    SSLOptions +StdEnvVars
            </FilesMatch>
	</VirtualHost>
</IfModule>

# AddDefaultCharset utf-8
DocumentRoot "/srv/www/home/srv1.metropol.com.br/"
# ServerName srv1.metropol.com.br
# ServerAlias srv1.monital.com.br

<VirtualHost *:80>
    DocumentRoot "/srv/www/home/srv1.metropol.com.br/"
    #<LocationMatch "(/~.*/|/ftp/)">
    #   Require all denied
    #</LocationMatch>
</VirtualHost>

#Debug off ou extended
TraceEnable Off

ServerTokens Minimal
ServerSignature On

<Directory />
    Options None
    AllowOverride None
    Require all denied
    #Require ip 10. 192.168. 172.16. 127.
    #Require host .localnet
    #Require local

    # DirectoryIndex index.php
    <IfModule mod_php5.c>
            AddType application/x-httpd-php .php
	    php_admin_flag  engine     			"Off"
	    php_admin_value include_path		"/usr/share/php"
	    php_admin_flag  safe_mode                   "On"
	    php_admin_value safe_mode_include_dir       "/usr/share/php"
	    #php_admin_value user_dir 			"/srv/www/home"
	    php_admin_flag  expose_php                  "Off"
	    php_admin_flag  display_errors              "Off"
	    php_admin_flag  track_errors                "On"
	    php_admin_flag  log_errors                  "On"
	    php_admin_flag  track_vars                  "Off"
	    php_admin_flag  magic_quotes_runtime        "Off"
	    php_admin_flag  magic_quotes_gpc 		"On"
	    php_admin_flag  trans_sid                   "Yes"
	    php_admin_flag  short_open_tag              "On"
	    php_admin_flag  session.bug_compat_42       "0"
	    php_admin_flag  session.bug_compat_warn     "1"
	    # php_admin_flag  default_charset 		"iso-8859-1"
	    php_admin_flag  default_charset 		"UTF-8"
	    php_admin_value max_execution_time          "600"
	    php_admin_value max_input_time              "120"
	    php_admin_value output_buffering		"4096"
	    php_admin_flag  zlib.output_compression     "Off"
	    php_admin_value zlib.output_compression_level "9"
	    #http://br.php.net/register_globals
	    php_admin_flag  register_globals     	"Off"
	    #Tapa Buracos no php..
	    #while(list($k,$v)=each($_POST)){ 
	    #	$$k=$v; //Yes, that's two dollar signs 
	    #}  
	    php_admin_flag  enable_dl			"Off"
	    php_admin_flag  allow_url_fopen		"Off"
	    php_admin_flag  safe_mode_gid		"Off"
	    php_admin_value upload_tmp_dir              "/tmp"
	    php_admin_value open_basedir        	"/tmp:/usr/share/php"
	    php_admin_value error_log                   "/tmp/phperr.default"
	    php_admin_value date.timezone               "America/Sao_Paulo"
	    php_admin_flag  file_uploads                "On"
	    php_admin_value upload_max_filesize         "32M"
	    php_admin_value memory_limit                "16M"
	    php_admin_value post_max_size               "8M"
	    php_admin_value disable_functions           "system, show_source, symlink, exec, dl, shell_exec, passthru, phpinfo, escapeshellarg, escapeshellcmd, proc_open, popen, curl_exec, curl_multi_exec, parse_ini_file, show_source"
    </IfModule>
    #Cross-Site-Tracing attack
    #<IfModule mod_rewrite.c>
	RewriteEngine On
	RewriteCond %{REQUEST_METHOD} ^TRACE
	RewriteRule .* - [F]
    #</IfModule>
</Directory>

<Directory "/usr/lib/cgi-bin">
   AllowOverride None
   Options -ExecCGI -MultiViews -SymLinksIfOwnerMatch
   Require all denied
</Directory>

<Directory "/srv/www/*/">
    Require all granted
    Options -FollowSymLinks +SymLinksIfOwnerMatch 
    AllowOverride FileInfo AuthConfig Limit Indexes
    IndexOrderDefault Ascending Name
    IndexOptions FancyIndexing SuppressDescription FoldersFirst NameWidth=* TrackModified
    php_admin_flag  engine           		"On"
    php_admin_flag  safe_mode                   "On"
    php_admin_flag  display_errors              "On"
    php_admin_value open_basedir        	"/tmp:/usr/share/php:/srv/www"
    php_admin_value user_dir 			"/srv/www/home"
    php_admin_value error_log                   "/tmp/phperr.www"
    php_admin_flag  safe_mode_gid               "On"
    php_admin_flag  allow_url_fopen		"On"
</Directory>

