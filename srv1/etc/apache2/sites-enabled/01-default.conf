DirectoryIndex index.htm
#CheckSpelling On
ContentDigest on
FileETag All
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 2
UseCanonicalName Off
ServerAdmin suporte@metropol.com.br
ServerTokens Prod
ServerSignature Off
DefaultLanguage pt-br
LanguagePriority pt-br es en

# Header add CopyRight "MetropolAlarmes"

