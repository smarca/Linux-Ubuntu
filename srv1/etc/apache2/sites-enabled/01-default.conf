<IfModule mpm_worker_module>
    StartServers           1
    Server Limit          16
    MaxClients           150
    MinSpareThreads        3
    MaxSpareThreads        6
#   ThreadsPerChild       25
    MaxRequestsPerChild 3000
</IfModule>

# Maximo: 128Megas, 30 Processos,
