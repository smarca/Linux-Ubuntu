#curl -I http://proxy.a.localnet

<VirtualHost *:80>
    DirectoryIndex wpad.dat
    ServerAlias proxy.* wpad.* wpad proxy
    DocumentRoot "/srv/www/default/proxy/"
    LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{User-Agent}i\"" logwpad
    CustomLog /var/log/apache2/wpad.log logwpad
    AddType application/x-ns-proxy-autoconfig .dat .pac
    <IfModule mod_rewrite.c>
	#http://httpd.apache.org/docs/2.4/rewrite/flags.html
        RewriteEngine On
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-d
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-f
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-l
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-s
	RewriteRule . /wpad.dat [L,R=301]
    </IfModule>
</VirtualHost>

<Directory "/srv/www/default/proxy/">
    Require ip 10. 192.168. 172.16. 127.
    Require host .localnet
    Require local
    AllowOverride None

    HostnameLookups on
    FileETag None
    ServerSignature Off
    ContentDigest On
    <IfModule mod_usertrack.c>
        CookieTracking off
    </IfModule>
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault A1800
    </IfModule>
    <IfModule mod_headers.c>
        # Header merge Cache-Control private
        # Header merge Cache-Control no-store
        # Header merge Cache-Control no-cache
        # Header merge Cache-Control must-revalidate
        Header unset Accept-Ranges
        # Header set Accept-Ranges none
        Header unset Last-Modified
    </IfModule>
    <IfModule mod_mod_speling.c>
        CheckSpelling off
    </IfModule>
    <FilesMatch ".+\.(dat|pac)$">
	ForceType application/x-ns-proxy-autoconfig
    </FilesMatch>
    <FilesMatch ".+\.(gif|jpe?g|png|mpg|avi|zip)$">
        ForceType None
    </FilesMatch>

</Directory>

