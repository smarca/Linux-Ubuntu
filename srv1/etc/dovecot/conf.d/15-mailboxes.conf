##
## Mailbox definitions
##

#\All \Archive \Drafts \Flagged \Junk \Sent \Trash
namespace inbox {
  inbox=yes
  type = private

  mailbox Drafts {
    auto = subscribe # autocreate and autosubscribe the Sent mailbox
    special_use = \Drafts
  }
  mailbox Trash {
    auto = subscribe # autocreate and autosubscribe the Sent mailbox
    special_use = \Trash
  }
  mailbox Sent {
    auto = subscribe # autocreate and autosubscribe the Sent mailbox
    special_use = \Sent
  }
  mailbox Spam {
    auto = create
    special_use = \Junk
  }
  mailbox Archive {
    auto = no # autocreate and autosubscribe the Sent mailbox
    special_use = \Archive
  }
  #If you have a virtual "Flagged" mailbox:
  mailbox virtual/Flagged {
      auto = no
      special_use = \Flagged
  }

  # If you have a virtual "All messages" mailbox:
  mailbox virtual/All {
      auto = no
      special_use = \All
  }
}

