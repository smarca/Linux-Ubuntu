##
## Plugin settings
##

# All wanted plugins must be listed in mail_plugins setting before any of the
# settings take effect. See <doc/wiki/Plugins.txt> for list of plugins and
# their configuration. Note that %variable expansion is done for all values.

plugin {
    trash = /etc/dovecot/conf.d/dovecot-trash.conf.ext
    
    #Plugin mailbox_alias
    #mailbox_alias_old   = Sent
    #mailbox_alias_new   = Itens Enviados
    #mailbox_alias_old2  = Sent
    #mailbox_alias_new2  = Sent Messages
    #mailbox_alias_old3  = Sent
    #mailbox_alias_new3  = Sent Items
    #mailbox_alias_old4  = Trash
    #mailbox_alias_new4  = Itens Excluídos
    #mailbox_alias_old5  = Trash
    #mailbox_alias_new5  = Itens Exclu&AO0-dos
    #mailbox_alias_old6  = Spam
    #mailbox_alias_new6  = Lixo Eletrônico
    #mailbox_alias_old7  = Spam
    #mailbox_alias_new7  = Lixo Eletr&APQ-nico
    #mailbox_alias_old8  = Spam
    #mailbox_alias_new8  = Lixo eletr&APQ-nico
    #mailbox_alias_old9  = Archive
    #mailbox_alias_new9  = Arquivados
    #mailbox_alias_old10 = Templates
    #mailbox_alias_new10 = Modelos

    #Plugin last_login (erro, sem módulo)
    #last_login_dict = proxy::lastlogin
    #last_login_key = last-login/%u # default

    #Plugin zlib
    #zlib_save_level = 6 # 1..9; default is 6
    #zlib_save = gz # or bz2, xz or lz4
}

##
## Dictionary server settings
##

# Dictionary can be used to store key=value lists. This is used by several
# plugins. The dictionary can be accessed either directly or though a
# dictionary server. The following dict block maps dictionary names to URIs
# when the server is used. These can then be referenced using URIs in format
# "proxy::<name>".

dict {
    #lastlogin = mysql:/etc/dovecot/conf.d/dovecot-dict-sql.conf.ext
    #sqlquota = mysql:/etc/dovecot/dovecot-dict-sql.conf.ext
    #quota = mysql:/etc/dovecot/dovecot-dict-sql.conf.ext
    #expire = sqlite:/etc/dovecot/dovecot-dict-sql.conf.ext
}

