.ifdef NOSIGN_ROUTER
  #Envia o return-path normal, comum, sem assinatura. Comumente usado em news, listas etc, ou dominios locais
  nosign_remote_send:
    driver 	= dnslookup
    condition   = ${if or {\
	    { eq {$sender_address} {} } \
	    { match{$h_precedence:}{(?i)bulk|list|junk|anon|circular} }\
	    { match{$h_auto-submitted:}{(?i)auto-generated|auto-replied} }\
	    { def:h_X-Cron-Env: } \
	    { def:h_Auto-Submitted: } \
	    { def:h_Autorespond: } \
	    { def:h_X-Autoresponse: } \
	    { def:h_X-Autoreply-From: } \
	    { match {$h_X-Auto-Response-Suppress: } {OOF} } \
	    { def:h_List-Id: } \
	    { def:h_List-Help: } \
	    { def:h_List-Unsubscribe:} \
	    { def:h_List-Subscribe: } \
	    { def:h_List-Owner: } \
	    { def:h_List-Post: } \
	    { def:h_List-Archive: } \
	    { def:h_X-Failed-Recipients: } \
         } {true}fail}
    condition  = ${if and {\
	    { match_domain{$domain}{+local_domains : +relay_to_domains : +alias_domains : +machine_domains} } \
            { match_domain{${domain:$return_path}}{+local_domains : +relay_to_domains : +alias_domains : +machine_domains} }\
            { match_domain{${domain:$sender_address_domain}}{+local_domains : +relay_to_domains : +alias_domains : +machine_domains} }\
	 } {true}fail}
    domains     = !+local_domains : !+alias_domains : !+relay_to_domains : !+machine_domains
    transport 	= nosign_delivery
    errors_to	= ${if def:return_path {${address:$return_path}}{${if def:sender_address {${address:$sender_address}}{${address:$h_From:}}}}}
    no_more
.endif

.ifdef VERP_ROUTER
  #Envia o return-path de uma maneira diferente, semelhante ao mailman
  verp_remote_send:
    driver 	= dnslookup
    condition 	= ${if or{{eq{$sender_host_address}{127.0.0.1}} \
                          {eq{$sender_host_address}{::1}}\
                          {eq{$sender_host_address}{}}\
		    }{yes}{no}}
    domains     = !+local_domains : !+alias_domains : !+relay_to_domains : !+machine_domains
    ignore_target_hosts   = +ignore_target_hosts
    senders 	= !: VERP_ROUTER
    transport 	= verp_delivery
    errors_to	= ${if def:return_path {${address:$return_path}}{${if def:sender_address {${address:$sender_address}}{${address:$h_From:}}}}}
    no_more
.endif

.ifdef SIGN_PASS
  #-Envia diretamente os emails ja assinados via SIGN_PASS. Evita fazer re-assinaturas
  # Quando o RCPT eh validado
  sign_remote_recipient_send:
    driver 	      = dnslookup
    local_parts       = !: ^SIGN_PREFIX=*
    domains           = !+local_domains : !+alias_domains : !+relay_to_domains : !+machine_domains
    #mx_domains	      = ${domain}
    condition	      = ${if and {\
			     {match{$local_part}{(?i)^(.+)=(.+)=(.+)\\.(.+)=(.+)\$}}\
			     {eqi\ 
				{${hash_SIGN_SIZE:${hmac{SIGN_HASH}{${length_SIGN_DATESIZE:$tod_zulu}SIGN_PASS}{\
			             ${lc:${extract{3}{=}{$local_part}}=${extract{4}{=}{$local_part}}=$sender_address_domain=$sender_address_local_part}}}}}\
			        {${extract{2}{=}{$local_part}}}}\
			 }{true}fail}
    self	      = fail
    transport	      = nosign_delivery
    ignore_target_hosts   = +ignore_target_hosts
    cannot_route_message  = Unrouteable address: <${domain}>
    debug_print       = "R: sign_remote_recipient_send from <${extract{4}{=}{${lc:$local_part}}}@${extract{3}{=}{${lc:$local_part}}}> for <${local_part}@${domain}>"
    headers_remove    = BYPASS_NHEADER
    no_more

  sign_remote_sender_send:
    driver 	      = dnslookup
    senders           = !: ^SIGN_PREFIX=*
    domains           = !+local_domains : !+alias_domains : !+relay_to_domains : !+machine_domains
    #mx_domains	      = ${domain}
    condition         = ${if and {\
                    	     {match_domain{$sender_address_domain}{+local_domains : +relay_to_domains : +alias_domains : +machine_domains} }\
			     {match{$sender_address_local_part}{(?i)^(.+)=(.+)=(.+)\\.(.+)=(.+)\$}}\
			     { eqi\
				{${hash_SIGN_SIZE:${hmac{SIGN_HASH}{${length_SIGN_DATESIZE:$tod_zulu}SIGN_PASS}{\
				    ${lc:${extract{3}{=}{$sender_address_local_part}}=${extract{4}{=}{$sender_address_local_part}}=$domain=$local_part}}}}}\
				{${extract{2}{=}{$sender_address_local_part}}}}\
			 }{true}fail}
    self	      = fail
    transport	      = nosign_delivery
    ignore_target_hosts   = +ignore_target_hosts
    cannot_route_message  = Unrouteable address: <${domain}>
    debug_print       = "R: sign_remote_sender_send from <${extract{4}{=}{${lc:$sender_address_local_part}}}@${extract{3}{=}{${lc:$sender_address_local_part}}}> for <${local_part}@${domain}>"
    headers_remove 	= BYPASS_NHEADER
    no_more

  #-Verificacao de endereco e redirecionamento ao endereco correto. Possibilita callout de outros servidores na origem fiel e tambem o envio de emails
  sign_redirect:
    driver            = redirect
    senders           = !:
    local_parts       = !: ^SIGN_PREFIX=*
    domains           = SIGN_DOMAIN
    condition	      = ${if and {\
			     {match{$local_part}{(?i)^(.+)=(.+)=(.+)\\.(.+)=(.+)\$}}\
			     {eqi\ 
				{${hash_SIGN_SIZE:${hmac{SIGN_HASH}{${length_SIGN_DATESIZE:$tod_zulu}SIGN_PASS}{\
			             ${lc:${extract{3}{=}{$local_part}}=${extract{4}{=}{$local_part}}=$sender_address_domain=$sender_address_local_part}}}}}\
			        {${extract{2}{=}{$local_part}}}}\
			 }{true}fail}
    data              = ${extract{4}{=}{${lc:$local_part}}}@${extract{3}{=}{${lc:$local_part}}}
    debug_print       = "R: sign_redirect from <$sender_address_local_part@$sender_address_domain> for <${extract{4}{=}{${lc:$local_part}}}@${extract{3}{=}{${lc:$local_part}}}>"
    headers_remove    = to:errors-to
    headers_add       = "To: ${extract{4}{=}{${lc:$local_part}}}@${extract{3}{=}{${lc:$local_part}}}\nErrors-To: ${address:$reply_address}"
    no_expn
    no_more
.endif

.ifdef BATV_PASS
  #-Envia diretamente os emails ja assinados via BATV. Evita fazer re-assinaturas
  batv_remote_send:
    driver 	      = dnslookup
    senders           = ^BATV_PREFIX=*
    domains           = !+local_domains : !+alias_domains : !+relay_to_domains : !+machine_domains
