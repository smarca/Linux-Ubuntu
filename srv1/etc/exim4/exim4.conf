# SERVIDOR NTLM: codificacao usada no Outlook Express
.ifdef MYSQL_SERVER
server_spa:
  server_advertise_condition = USE_MYSQL_PASSWD_CLEAN
  driver 		= spa
  public_name 		= NTLM
  server_password 	= ${lookup mysql{MYSQL_PASSWD_CLEAN}{$value}fail}
  server_set_id 	= ${address:$auth1}
  #client_domain 	= DOMAIN_OR_UNSET
.endif

# SERVIDOR CRAM-MD5: user e pass codificados em md5
.ifdef MYSQL_SERVER
server_cram:
  server_advertise_condition = USE_MYSQL_PASSWD_CLEAN
  driver 		= cram_md5
  public_name 		= CRAM-MD5
  server_secret 	= ${lookup mysql{MYSQL_PASSWD_CLEAN}{$value}fail}
  server_set_id 	= ${address:$auth1}
  #server_set_id 	= ${extract {1}{@%!}{$auth1}}@${extract {2}{@%!}{$auth1}}
.endif

# SERVIDOR PLAIN: user e pass codificados em base64-coded - usado pelo Netscape
server_plain:
  server_advertise_condition = ${if eq{$tls_cipher}{}{}{*}}
  driver 		= plaintext
  public_name           = PLAIN
.ifdef MYSQL_SERVER
  server_condition 	= "${if eq {${if match{$auth2}{@}{yes}{no}}}{yes}\
    {${if and{\
	{!eq {$auth2}{}} {!eq {$auth3}{}} \
	{eq {${lookup mysql {MYSQL_PASSWD_MD5_PLAIN}{$value}{*:*}}}{${md5:$auth3}}} \
      }{yes}{no}}}\
      {${if pam{$auth2:${sg{$auth3}{:}{::}}}{yes}{no}}}}"
.else
  server_condition      = ${if pam{$auth2:${sg{$auth3}{:}{::}}}{yes}{no}}
.endif
  server_set_id 	= ${address:$auth2}
  #server_set_id 	= ${extract {1}{@%!}{$auth2}}@${extract {2}{@%!}{$auth2}}

