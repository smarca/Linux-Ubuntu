.include /etc/exim4/exim.local2.conf

#-Mysql query
.ifdef MYSQL_SERVER
 hide mysql_servers 	= MYSQL_SERVER
 MYSQL_DOMAINS 		= SELECT domain.domain_name FROM domain WHERE domain.hst='DOM_HST' and domain.ativo='1'
 MYSQL_INAT_DOMAINS	= SELECT domain.domain_name FROM domain WHERE domain.hst='DOM_HST' and domain.ativo='0'
 MYSQL_MX_DOMAINS 	= SELECT domainmx.domain_name FROM domainmx WHERE domainmx.hst='DOM_HST' and domainmx.ativo='1'
 MYSQL_ADOMAINS1	= SELECT domainalias.domain_alias FROM domainalias WHERE domainalias.hst='DOM_HST' and domainalias.ativo='1' 
 MYSQL_ADOMAINS2	= SELECT domainalias.domain_name FROM domainalias WHERE domainalias.hst='DOM_HST' and domainalias.ativo='1'\
			    AND  domainalias.domain_alias='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			    LIMIT 1
 MYSQL_ALIASES		= SELECT forwarder.remote_name \
			    FROM forwarder \
			    LEFT JOIN domain ON ( forwarder.domain_name = domain.domain_name ) \
			    WHERE forwarder.hst='DOM_HST' and forwarder.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \
			        AND forwarder.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			        AND domain.ativo='1' \
			        AND forwarder.ativo='1' \
			        AND forwarder.copia='0' 
 MYSQL_COPIA  		= SELECT forwarder.remote_name \
			    FROM forwarder \
			    LEFT JOIN domain ON ( forwarder.domain_name = domain.domain_name ) \
			    WHERE forwarder.hst='DOM_HST' and forwarder.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \
				AND forwarder.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
				AND domain.ativo='1' \
				AND forwarder.ativo='1' \
				AND forwarder.copia='1' 
 MYSQL_DEFAULTUSER	= SELECT CONCAT(domain.alias,'@',domain.domain_name) \
			    FROM domain \
			    WHERE domain.hst='DOM_HST' and domain.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			        AND domain.alias<>'' \
			        AND domain.ativo='1' \
			    LIMIT 1
 MYSQL_GATEWAY		= SELECT gateway.domain_host \
			    FROM gateway \
			    WHERE gateway.hst='DOM_HST' and gateway.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
				AND gateway.ativo='1' \
				ORDER BY RAND( ) \
			    LIMIT 1
 MYSQL_USERS		= SELECT popbox.local_part \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \
				AND popbox.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
				AND (domain.ativo='1' \
				AND popbox.ativo='1') \
			    LIMIT 1
 MYSQL_INAT_USERS       = SELECT CONCAT(popbox.local_part,'@',popbox.domain_name) from popbox \
			    WHERE popbox.hst='DOM_HST' and popbox.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
				AND popbox.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \	
				AND popbox.ativo='0'\
			    LIMIT 1
 MYSQL_DIRECTORY 	= SELECT CONCAT(domain.home,'/mails/',popbox.local_part,'/Maildir') \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \
				AND popbox.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			    LIMIT 1
 MYSQL_UID 		= SELECT domain.uid \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \
				AND popbox.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			    LIMIT 1
 MYSQL_GID 		= SELECT domain.gid \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \
				AND popbox.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			    LIMIT 1
 MYSQL_QUOTAS 		= SELECT ((domain.quotas + popbox.quotas) * 1048576) \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}' \
				AND popbox.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			    LIMIT 1

 MYSQL_QUOTAC 		= SELECT (domain.quotac + popbox.quotac) \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${if def:local_part{$local_part}{$sender_address_local_part}}}'\
				AND popbox.domain_name='${quote_mysql:${if def:domain{$domain}{$sender_address_domain}}}' \
			    LIMIT 1
 MYSQL_PASSWD_MD5_LOGIN	= SELECT popbox.password_md5 \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${extract {1}{@%!}{$auth1}}}' \ 
				AND popbox.domain_name='${quote_mysql:${extract {2}{@%!}{$auth1}}}' \
				AND domain.ativo='1' \
				AND popbox.ativo='1' \
			    LIMIT 1
 MYSQL_PASSWD_MD5_PLAIN = SELECT popbox.password_md5 \
			    FROM popbox \
			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${extract {1}{@%!}{$auth2}}}' \
				AND popbox.domain_name='${quote_mysql:${extract {2}{@%!}{$auth2}}}' \
				AND domain.ativo='1' \
				AND popbox.ativo='1' \
			    LIMIT 1
 MYSQL_PASSWD_CLEAN = SELECT popbox.password_clean \
 			    FROM popbox \
 			    LEFT JOIN domain ON ( popbox.domain_name = domain.domain_name ) \
 			    WHERE domain.hst='DOM_HST' and popbox.local_part='${quote_mysql:${extract {1}{@%!}{$auth1}}}' \
 				AND popbox.domain_name='${quote_mysql:${extract {2}{@%!}{$auth1}}}' \
 				AND domain.ativo='1' \
 				AND popbox.ativo='1' \
 				AND NOT(password_clean IS NULL) \
 			    LIMIT 1
  .ifdef GREYLIST_ENABLED_GREY
    #Lista de SkipGreyList
    hostlist_cache grey_skip_host = +ignore_defer : +ignore_unknown : /etc/exim4/lst/skp_greylist

  #-- ${mask:$sender_host_address/24}
    GREYLIST_TABLE     = greylist
    GREYLIST_TEST      = SELECT CASE WHEN now() > block_expires \
			    THEN "accepted" \
			    ELSE "deferred" END AS result, \
			    id FROM GREYLIST_TABLE \
    			    WHERE (now() < record_expires) \
    			    AND (sender_type = '${quote_mysql:$acl_m_lib_ext_type}') \
       			    AND (sender      = '${quote_mysql:${domain:$acl_m_lib_ext_addr}}') \
       			    AND (recipient   = '${quote_mysql:${domain:$acl_m_lib_int_addr}}') \
       			    AND (relay_ip    = '${quote_mysql:$sender_host_address}') \
       			    AND (helo        = '${quote_mysql:${if def:sender_helo_name {$sender_helo_name}{$sender_host_address}}}') \
     			    ORDER BY record_expires ASC LIMIT 1
    GREYLIST_ADD 	= REPLACE INTO GREYLIST_TABLE (hst,relay_ip, sender_type, helo, sender, recipient, block_expires, record_expires, create_time, last_block, passcount, blockcount, type) \
    			    VALUES ('DOM_HST', '${quote_mysql:$sender_host_address}', \
				'${quote_mysql:$acl_m_lib_ext_type}', \
		        	'${quote_mysql:${if def:sender_helo_name {$sender_helo_name}{$sender_host_address}}}', \
				'${quote_mysql:${domain:$acl_m_lib_ext_addr}}', \
				'${quote_mysql:${domain:$acl_m_lib_int_addr}}', \
		        	DATE_ADD(now(), INTERVAL $acl_m_grey_initmin), \
		        	DATE_ADD(now(), INTERVAL $acl_m_grey_initmax), \
		        	now(), \
		        	now(), \
		        	0, 1, \
		        	'AUTO' ) 
    GREYLIST_HIT_DEFER 	= UPDATE GREYLIST_TABLE \
			    SET hst='DOM_HST', blockcount=blockcount+1, last_block=now() \
			    WHERE id = $acl_m_greyuid
    GREYLIST_HIT_OK 	= UPDATE GREYLIST_TABLE \
			    SET hst='DOM_HST', passcount=passcount+1, last_pass=now() \
			    WHERE id = $acl_m_greyuid
    GREYLIST_LIFETIME_OK = UPDATE GREYLIST_TABLE \
			    SET hst='DOM_HST', record_expires = DATE_ADD(now(), INTERVAL $acl_m_grey_lifetime) \
			    WHERE id = $acl_m_greyuid AND type='AUTO'
    GREYLIST_CLEAN 	= DELETE FROM GREYLIST_TABLE \
			    WHERE (record_expires < DATE_SUB(CURDATE(),INTERVAL GREYLIST_CLEAR_LIFETIME)) AND (type='AUTO')
  .endif

  #Loglist controla o recebimento dos emails do seguinte modo:
  .ifdef LOGLIST_ENABLED
    LOGLIST_TABLE     = loglist
    LOGLIST_TEST      = SELECT CASE WHEN now() < ext_expires \
			    THEN "accepted" \
			    ELSE "deferred" END AS result, \
			    id FROM LOGLIST_TABLE \
    			    WHERE (now() < int_expires) \
    			    AND (int_type = '${quote_mysql:$acl_m_lib_ext_type}') \
       			    AND (int_dom = '${quote_mysql:${domain:$acl_m_lib_int_addr}}') \
    			    AND (ext_type = '${quote_mysql:$acl_m_lib_ext_type}') \
       			    AND (ext_dom = '${quote_mysql:${domain:$acl_m_lib_ext_addr}}') \
     			    ORDER BY ext_expires ASC LIMIT 1

    LOGLIST_CNT       = SELECT int_passcount AS result_int, ext_passcount AS result_ext, id \
			    FROM LOGLIST_TABLE \
    			    WHERE (now() < int_expires) AND (now() < ext_expires) \
    			    AND (int_type = '${quote_mysql:$acl_m_lib_int_type}') \
       			    AND (int_dom = '${quote_mysql:${domain:$acl_m_lib_int_addr}}') \
    			    AND (ext_type = '${quote_mysql:$acl_m_lib_ext_type}') \
       			    AND (ext_dom = '${quote_mysql:${domain:$acl_m_lib_ext_addr}}') \
     			    ORDER BY ext_expires ASC LIMIT 1

    LOGLIST_ADD_INT 	= REPLACE INTO LOGLIST_TABLE (hst, int_type, int_dom, ext_type, ext_dom, ext_expires, int_expires, create_time, int_last_pass, int_passcount, ext_passcount, type) \
    			    VALUES ('DOM_HST', \
				'${quote_mysql:$acl_m_lib_int_type}', \
				'${quote_mysql:${domain:$acl_m_lib_int_addr}}', \
				'${quote_mysql:$acl_m_lib_ext_type}', \
				'${quote_mysql:${domain:$acl_m_lib_ext_addr}}', \
		        	DATE_ADD(now(), INTERVAL $acl_m_log_initmin), \
		        	DATE_ADD(now(), INTERVAL $acl_m_log_initmax), \
		        	now(), now(), 1, 0, 'AUTO' ) 
    LOGLIST_ADD_EXT 	= REPLACE INTO LOGLIST_TABLE (hst, int_type, int_dom, ext_type, ext_dom, ext_expires, int_expires, create_time, ext_last_pass, ext_passcount, int_passcount, type) \
    			    VALUES ('DOM_HST', \
				'${quote_mysql:$acl_m_lib_int_type}', \
				'${quote_mysql:${domain:$acl_m_lib_int_addr}}', \
				'${quote_mysql:$acl_m_lib_ext_type}', \
				'${quote_mysql:${domain:$acl_m_lib_ext_addr}}', \
		        	DATE_ADD(now(), INTERVAL $acl_m_log_initmin), \
		        	DATE_ADD(now(), INTERVAL $acl_m_log_initmax), \
		        	now(), now(), 1, 0, 'AUTO' ) 
    LOGLIST_HIT_INT_OK= UPDATE LOGLIST_TABLE \
			    SET hst='DOM_HST', int_passcount=int_passcount+1, int_last_pass=now() \
			    WHERE id = $acl_m_log_uid 
    LOGLIST_HIT_EXT_OK= UPDATE LOGLIST_TABLE \
			    SET hst='DOM_HST', ext_passcount=ext_passcount+1, ext_last_pass=now() \
			    WHERE id = $acl_m_log_uid 
    LOGLIST_EXP_INT_OK= UPDATE LOGLIST_TABLE \
			    SET hst='DOM_HST', int_passcount=int_passcount+1, int_last_pass=now(), \
		    	    ext_expires = DATE_ADD(now(), INTERVAL $acl_m_log_initmin), \
		    	    int_expires = DATE_ADD(now(), INTERVAL $acl_m_log_initmax) \
			    WHERE id = $acl_m_log_uid AND type='AUTO'
    LOGLIST_EXP_EXT_OK= UPDATE LOGLIST_TABLE \
			    SET hst='DOM_HST', ext_passcount=ext_passcount+1, ext_last_pass=now(), \
		    	    ext_expires = DATE_ADD(now(), INTERVAL $acl_m_log_initmin) \
			    WHERE id = $acl_m_log_uid AND type='AUTO'

    LOGLIST_CLEAN 	= DELETE FROM LOGLIST_TABLE \
			    WHERE (int_expires < DATE_SUB(CURDATE(),INTERVAL LOGLIST_CLEAR_LIFETIME)) AND (type='AUTO')
  .endif
.endif

#-Hosts, dominios, emails e localparts
qualify_domain 			= DOM_LOCAL
#${if def:smtp_active_hostname {$smtp_active_hostname}{$primary_hostname}}
primary_hostname        	= DOM_LOCAL
hostlist_cache relay_from_hosts	= +ignore_defer : +ignore_unknown : @[] : 127.0.0.0/8 : 10.0.0.0/8 : 192.168.0.0/16 : 172.16.0.0/12 : RELAY_HOSTS : NOFORCE_AUTH
hostlist_cache noauth_from_hosts= +ignore_defer : +ignore_unknown : NOFORCE_AUTH
hostlist_cache relay_mx_hosts= +ignore_defer : +ignore_unknown : MX_HOSTS 
localpartlist_cache localpart_security = USR_SECURITY
localpartlist_cache localpart_discard = USR_DISCARD
hostlist_cache ignore_target_hosts = +ignore_defer : +ignore_unknown : ! +relay_from_hosts : !+relay_mx_hosts : 127.0.0.0/8 : 172.16.0.0/12  : 10.0.0.0/8 : 192.168.0.0/16 : 169.254.0.0/16 : \
					0.0.0.0/8 	 : 14.0.0.0/8	  : 240.0.0.0/4 : 224.0.0.0/4

.ifdef MYSQL_SERVER
 domainlist_cache local_domains   = ${sg{${lookup mysql{MYSQL_DOMAINS}{$value}}}{(.+)}{\$1:}}
 domainlist_cache alias_domains	= ${sg{${lookup mysql{MYSQL_ADOMAINS1}{$value}}}{(.+)}{\$1:}}
 domainlist_cache machine_domains = @[] : localhost : DOM_LOCAL : DOM_ALIAS 
 domainlist_cache disabled_domains = DOM_DISABLED : ${sg{${lookup mysql{MYSQL_INAT_DOMAINS}{$value}}}{(.+)}{\$1:}}
 domainlist_cache relay_to_domains = DOM_MX : ${sg{${lookup mysql{MYSQL_MX_DOMAINS}{$value}}}{(.+)}{\$1:}}
 addresslist disabled_users	= ADDR_DISABLED : mysql;MYSQL_INAT_USERS
.else
 domainlist_cache local_domains	= 
 domainlist_cache alias_domains =
 domainlist_cache machine_domains = @[] : localhost : DOM_LOCAL : DOM_ALIAS 
 domainlist_cache disabled_domains = DOM_DISABLED
 domainlist_cache relay_to_domains = DOM_MX 
 addresslist_cache disabled_users = ADDR_DISABLED
.endif

