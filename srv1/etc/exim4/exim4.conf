#Lista permissao de bounce vazio e com menos restricoes de recebimento ou BATV
.ifdef BATV_HSTPASS
    hostlist_cache batv_pass_host = +ignore_defer : +ignore_unknown : BATV_HSTPASS : /etc/exim4/lst/fre_emptybounce
