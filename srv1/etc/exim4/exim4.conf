# http://www.exim.org/exim-html-current/doc/html/spec_html/ch-variable_index.html
#(#exim_dumpdb /var/spool/exim4/ ratelimit)
acl_check_quit:

  #-LOG: Loglist se já foi enviado email de dentro para o dominio de fora
    warn  condition     = ${if def:smtp_notquit_reason {true}{false}}
	  condition     = ${if match{$smtp_notquit_reason}{(?i)acl-drop|connection-lost} {no}{yes}}
          logwrite      = :main: $message_exim_id NOQUIT - F=$sender_address_domain H=$sender_rcvhost: $smtp_notquit_reason
    .ifdef BLK_RATE_AUTHFAIL_IP
    warn ! hosts        = @[] : +relay_from_hosts : +relay_mx_hosts
	 condition     	= $authentication_failed
         ratelimit      = BLK_RATE_AUTHFAIL_IP / strict / per_conn / Auth-IP=$sender_host_address
	 condition 	= ${if le{$sender_rate}{$sender_rate_limit}}
	 logwrite      = :reject,main: $message_exim_id RateLimit: $sender_rate/$sender_rate_limit/$sender_rate_period - H=$sender_rcvhost: Auth-IP=$sender_host_address
    .endif
    .ifdef BLK_RATE_AUTHFAIL_HELO
    warn condition     	= $authentication_failed
         ratelimit      = BLK_RATE_AUTHFAIL_HELO / strict / per_conn / Auth-HELO=$sender_helo_name
	 condition 	= ${if le{$sender_rate}{$sender_rate_limit}}
	 logwrite      = :reject,main: $message_exim_id RateLimit: $sender_rate/$sender_rate_limit/$sender_rate_period - H=$sender_rcvhost: Auth-HELO=$sender_helo_name
    .endif
    accept

#--------------------------------------------------------------------------------------------------------------------
# http://www.exim.org/exim-html-current/doc/html/spec_html/ch40.html
#    acl-drop  Another ACL issued a drop command 
#    bad-commands  Too many unknown or non-mail commands 
#    command-timeout  Timeout while reading SMTP commands 
#    connection-lost  The SMTP connection has been lost 
#    data-timeout  Timeout while reading message data 
#    local-scan-error  The local_scan() function crashed 
#    local-scan-timeout  The local_scan() function timed out 
#    signal-exit  SIGTERM or SIGINT 
#    synchronization-error  SMTP synchronization error 
#    tls-failed  TLS failed to start 

#--------------------------------------------------------------------------------------------------------------------
#- Apos quit, na saida do sistema - After invalid ($rcpt_count - $recipients_count) and valid $recipients_count -- $rcpt_fail_count
#  $smtp_command_argument - $smtp_command
# Ver criptografia em server_advertise_condition 
#acl_check_quit:
#    warn condition      = ${if eq {$smtp_notquit_reason} {acl-drop}{no}{yes}}
#         logwrite       = :main: $message_exim_id NOQUIT - F=$sender_address_domain H=$sender_rcvhost: $smtp_notquit_reason
#    accept 
# Message-Linecount: $message_linecount  
# Body-Linecount: $body_linecount
# Message-Size: $message_size
# Body-Size: $message_body_size
# Received-Count: $received_count
# Recipient-Count: $recipients_count
# Local-Recipient-Count: $rcpt_count
# Local-Recipient-Defer-Count: $rcpt_defer_count          
# Local-Recipient-Fail-Count: $rcpt_fail_count
#--------------------------------------------------------------------------------------------------------------------
#Domain Key
.ifdef BLK_DKNEW
acl_check_dkim:
	deny    dkim_status     = none : invalid : fail
		condition   	= ${lookup{$sender_address}nwildlsearch{/etc/exim4/lst/vrf_dkim}{yes}{no}}
	        condition  	= ${if inlisti{$sender_host_address}{${lookup dnsdb{>: defer_lax,a=${lookup dnsdb{>: defer_lax,mxh=${sender_address_domain}}}}}}{no}{yes}}
	        #condition  	= ${if inlisti{$sender_host_address}{${sg{${lookup dnsdb{>: a=${lookup dnsdb{>: mxh=${sender_address_domain}}}}}}{(([0-9]+\.\){3\})[0-9]+}{\$\{1\}0/24}}}{no}{yes}}
	        logwrite    	= :reject,main: DKIM FDENY F=$sender_address H=$sender_rcvhost: $dkim_verify_status ($dkim_verify_reason) 
                message     	= DKIM $dkim_verify_status - $dkim_verify_reason (check forced: ${lookup{$sender_address}nwildlsearch{/etc/exim4/lst/vrf_dkim}})
                dkim_status 	= none : invalid : fail

	deny    dkim_status     = fail
		condition  	= ${if inlisti{$sender_host_address}{${lookup dnsdb{>: defer_lax,a=${lookup dnsdb{>: defer_lax,mxh=${sender_address_domain}}}}}}{no}{yes}}
	        #condition  	= ${if inlisti{$sender_host_address}{${sg{${lookup dnsdb{>: a=${lookup dnsdb{>: mxh=${sender_address_domain}}}}}}{(([0-9]+\.\){3\})[0-9]+}{\$\{1\}0/24}}}{no}{yes}}
	        logwrite    	= :reject,main: DKIM DENY F=$sender_address H=$sender_rcvhost: $dkim_verify_status ($dkim_verify_reason) 
                message     	= DKIM $dkim_verify_status - $dkim_verify_reason 

        warn    dkim_status     = invalid
		add_header      = X-DKIM-Status: $dkim_verify_status [($dkim_cur_signer) - $sender_host_address - $dkim_verify_reason]
                sender_domains  = $sender_address_domain:$dkim_signers 
	        logwrite    	= :reject,main: DKIM WARN F=$sender_address H=$sender_rcvhost: $dkim_verify_status ($dkim_verify_reason) 
                dkim_signers    = $sender_address_domain:$dkim_signers 

        warn    dkim_status     = pass
		add_header      = X-DKIM-Status: $dkim_verify_status [d=$dkim_cur_signer s=$dkim_selector h=$sender_host_address a=$dkim_algo t=$dkim_key_testing]
                sender_domains  = $sender_address_domain:$dkim_signers 
                dkim_signers    = $sender_address_domain:$dkim_signers 
       accept
.endif
#--------------------------------------------------------------------------------------------------------------------
# SPF Perl
    # Based on Version 2.09 by david @ ols . es
    #    Mail::SPF::Query ver 1.9.1 (libmail-spf-query-perl>
    #    http://www.openspf.org/downloads.html and install it
    #	 run /usr/sbin/spfd --socket=/var/run/spfd/spfd --socket-user Debian-exim --socket-group Debian-exim --set-user Debian-exim --set-group mail
    spf_connect:
       warn set acl_m_tspfaddr = ${if def:acl_m_spfaddr {${address:$acl_m_spfaddr}}{\
                                ${if def:h_reply-to: {${address:$h_reply-to:}}{\
                                ${if def:h_from: {${address:$h_from:}}{\
                                ${if def:h_sender: {${address:$h_sender:}}{\
                                ${if def:sender_address {${address:$sender_address}}{\
				unknown@${sender_helo_name}\
                        	}}}}}}}}}}
	    set acl_m_spfaddr =
	    set acl_m_spfsock = ${readsocket{/var/run/spfd/spfd}\
                           {ip=$sender_host_address\n\
                           helo=${if def:sender_helo_name\
                           {$sender_helo_name}{NOHELO}}\
                           \nsender=$acl_m_tspfaddr\n\n}{20s}{\n}{socket failure}} 

       # Defer on socket error
       defer condition   = ${if eq{$acl_m_spfsock}{socket failure}{yes}{no}}
	     logwrite    = :main: $message_exim_id Cannot connect to spfd sock
             message     = Cannot connect to spfd
       # Prepare answer and get results
       warn  set acl_m_spfsock  = ${sg{$acl_m_spfsock}{\N=(.*)\n\N}{=\"\$1\" }}
             set acl_m_spfresult  = ${extract{result}{$acl_m_spfsock}{$value}{unknown}}
	     #Usar smtp_comment ou header_comment
             set acl_m_spfmsg  = ${extract{header_comment}{$acl_m_spfsock}{$value}{}}
             set acl_m_spfrec  = ${extract{spf_record}{$acl_m_spfsock}{$value}{}}

       warn  condition = ${if match {$acl_m_spfrec}{\\+all} {yes}{no}}
             set acl_m_spfresult = fakeall
	     set acl_m_spfmsg = domain of $acl_m_tspfaddr falsely designates everyone as permitted sender
	     logwrite  = :main: SPF SPAM F=$acl_m_tspfaddr H=$sender_rcvhost: $acl_m_spfresult ($acl_m_spfrec) 
       accept 

    #Bloquear em caso de falha.
    spf_blk:
	warn !acl        = spf_connect
	deny condition   = ${if forany{BLK_Spf_PERL}{eq{$item}{$acl_m_spfresult}}{yes}{no}}
	     condition	 = ${if inlisti{$sender_host_address}{${lookup dnsdb{>: defer_lax,a=${lookup dnsdb{>: defer_lax,mxh=${domain:$acl_m_tspfaddr}}}}}}{no}{yes}}
	     #condition  = ${if inlisti{$sender_host_address}{${sg{${lookup dnsdb{>: a=${lookup dnsdb{>: mxh=${domain:$acl_m_tspfaddr}}}}}}{(([0-9]+\.\){3\})[0-9]+}{\$\{1\}0/24}}}{no}{yes}}
	     logwrite    = :reject,main: SPF DENY F=$acl_m_tspfaddr H=$sender_rcvhost: $acl_m_spfresult ($acl_m_spfrec) 
             message     = SPF $acl_m_spfresult - $acl_m_spfmsg
	accept 

     #Dominios obrigatorios a ter spf PASS
     spf_fblk:
	warn !acl        = spf_connect
	deny condition   = ${if forany{FRC_Spf_PERL}{eq{$item}{$acl_m_spfresult}}{yes}{no}}
	     condition	 = ${lookup{$acl_m_tspfaddr}nwildlsearch{/etc/exim4/lst/vrf_spf}{yes}{no}}
	     condition	 = ${if inlisti{$sender_host_address}{${lookup dnsdb{>: defer_lax,a=${lookup dnsdb{>: defer_lax,mxh=${domain:$acl_m_tspfaddr}}}}}}{no}{yes}}
	     #condition  = ${if inlisti{$sender_host_address}{${sg{${lookup dnsdb{>: a=${lookup dnsdb{>: mxh=${domain:$acl_m_tspfaddr}}}}}}{(([0-9]+\.\){3\})[0-9]+}{\$\{1\}0/24}}}{no}{yes}}
	     logwrite    = :reject,main: SPF FDENY F=$acl_m_tspfaddr H=$sender_rcvhost: $acl_m_spfresult ($acl_m_spfrec) 
             message     = SPF $acl_m_spfresult - $acl_m_spfmsg (check forced: ${lookup{$acl_m_tspfaddr}nwildlsearch{/etc/exim4/lst/vrf_spf}})
	accept 
     #Em caso de pass apenas
     spf_acpt:
	warn !acl        = spf_connect
	accept condition = ${if forany{SKP_Spf_PERL}{eq{$item}{$acl_m_spfresult}}{yes}{no}}
        deny 
	      
     #Mensagem de Warn no header da mensagem
     spf_wrn:
	warn !acl        = spf_connect
	deny condition   = ${if forany{WRN_Spf_PERL}{eq{$item}{$acl_m_spfresult}}{yes}{no}}
	     add_header  = Received-SPF: $acl_m_spfresult ($acl_m_spfmsg)
	accept 

#--------------------------------------------------------------------------------------------------------------------
 fromto_lib_acl:
          # Pega dominio do loglist e outras variavesis
          warn set acl_m_lib_int_addr = ${if def:acl_m_from {${address:$acl_m_from}}{\
                    ${if def:h_reply-to: {${address:$h_reply-to:}}{\
                    ${if def:h_from: {${address:$h_from:}}{\
                    ${if def:h_sender: {${address:$h_sender:}}{\
                    ${if def:sender_address {${address:$sender_address}}{\
			unknown@DOM_LOCAL\
                    }}}}}}}}}}
	   set acl_m_from =
           set acl_m_lib_ext_addr = ${if def:acl_m_to {${address:$acl_m_to}}{\
                    ${if !def:local_part {${address:$recipients}}{\
                    ${if def:local_part {${address:$local_part@$domain}}{\
			 unknown\
        	    }}}}}}
	   set acl_m_to =


	  #Low case
          set acl_m_lib_ext_addr   = ${lc:$acl_m_lib_ext_addr}
          set acl_m_lib_int_addr = ${lc:$acl_m_lib_int_addr}

	  #Identificar se variavel interna ou nao
	  warn  set acl_m_lib_cliauth =
		set acl_m_lib_clihost =
          warn  authenticated = *
        	condition = ${if def:authenticated_id {yes}{no}}
		set acl_m_lib_cliauth = true
          warn  condition      = ${if match_domain{${domain:$acl_m_lib_int_addr}}{+local_domains:+alias_domains:+relay_to_domains:+machine_domains}{yes}{no}}
		set acl_m_lib_clihost = true

	  #Troca de lugar send e received se interno ou externo
	  warn condition = ${if or {{def:acl_m_lib_cliauth}{def:acl_m_lib_clihost}}{no}{yes}}
	       set acl_m_from  = $acl_m_lib_int_addr
	       set acl_m_to    = $acl_m_lib_ext_addr
	       set acl_m_lib_ext_addr   = $acl_m_from
               set acl_m_lib_int_addr = $acl_m_to
               set acl_m_from  =
               set acl_m_to    =

	  #Sair se vazio
	  #deny condition = ${if def:acl_m_lib_int_addr {no}{yes}}
	  #deny condition = ${if def:acl_m_lib_ext_addr {no}{yes}}
	  #Se do mesmo dominio, sai fora
          #deny condition = ${if eq {${domain:$acl_m_lib_int_addr}}{${domain:$acl_m_lib_ext_addr}}{yes}{no}}

	  #Verifica tipo INT
	  warn condition = ${if def:acl_m_lib_int_addr {no}{yes}}
	       set acl_m_lib_int_type = BOUNCE
          warn condition = ${if def:acl_m_lib_int_addr {yes}{no}}
	       set acl_m_lib_int_type = ${if def:sender_address_domain{${lookup{$acl_m_lib_int_addr}nwildlsearch{/etc/exim4/lst/bounce_senders}{BOUNCE}\
								  {${lookup{$acl_m_lib_int_addr}nwildlsearch{/etc/exim4/lst/machine_senders}{MACHINE}\
					{NORMAL}}}}}{BOUNCE}}
	  #Verifica tipo EXT
	  warn condition = ${if def:acl_m_lib_ext_addr {no}{yes}}
	       set acl_m_lib_ext_type = BOUNCE
          warn condition = ${if def:acl_m_lib_ext_addr {yes}{no}}
	       set acl_m_lib_ext_type = ${if def:sender_address_domain{${lookup{$acl_m_lib_int_addr}nwildlsearch{/etc/exim4/lst/bounce_senders}{BOUNCE}\
								  {${lookup{$acl_m_lib_int_addr}nwildlsearch{/etc/exim4/lst/machine_senders}{MACHINE}\
					{NORMAL}}}}}{BOUNCE}}

	  #Aceitar necessariamente
	  accept


#--------------------------------------------------------------------------------------------------------------------
#-Clausula GreyList (ocorre no rcpt e no data):
.ifdef GREYLIST_ENABLED_GREY
 greylist_acl:
	  # limpa registros do greylist as 00 e 30 minutos de todas as horas do dia (somente se por acaso houver delivery neste horario)
	  warn condition  = ${if or {{eqi {${substr{10}{2}{$tod_zulu}}}{00}}{eqi {${substr{10}{2}{$tod_zulu}}}{30}}}{yes}{no}}
 	      set acl_m_greycleanup = ${lookup mysql{GREYLIST_CLEAN}}

	  # sai do greylist em determinados casos
	  accept hosts    = +relay_from_hosts : +relay_mx_hosts
	  accept authenticated	= *
	         condition      = ${if def:authenticated_id {yes}{no}}

	  #Sai se hostname reverso ou range for da lista
	  accept hosts         = +grey_skip_host
		 #condition    = ${if def:sender_host_name {true}{false}}
		 #condition    = ${lookup{$sender_host_name}nwildlsearch{/etc/exim4/lst/skp_greylist}{yes}{no}}

	  #-ACT: Aceita Tudo para determinados enderecos
		accept condition     = ${if def:acl_m_acceptall_recipients {yes}{no}}
		accept condition     = ${if def:acl_m_acceptall_senders {yes}{no}}

	  #Sai se SPF OK
          .ifdef SKP_Spf_LIB
             accept spf  = SKP_Spf_LIB
          .endif
          .ifdef SKP_Spf_PERL
             accept acl  = spf_acpt
          .endif

	  #Biblioteca Generica
	  accept !acl      = fromto_lib_acl
	  #Sair se vazio
	  accept condition = ${if def:acl_m_lib_int_addr {no}{yes}}
	  accept condition = ${if def:acl_m_lib_ext_addr {no}{yes}}
	  #Se do mesmo dominio, sai fora
          deny condition = ${if eq {${domain:$acl_m_lib_int_addr}}{${domain:$acl_m_lib_ext_addr}}{yes}{no}}

	  #Calculos minimo e maximo
	  warn
               set acl_m_grey_lifetime = ${if eq{$acl_m_lib_ext_type}{BOUNCE}{GREYLIST_LIFETIME_BOUNCE}{${if eq{$acl_m_lib_ext_type}{MACHINE}{GREYLIST_LIFETIME_MACHINE}{GREYLIST_LIFETIME_NORMAL}}}}
               set acl_m_grey_initmin  = ${if eq{$acl_m_lib_ext_type}{BOUNCE}{GREYLIST_INITMIN_BOUNCE}{${if eq{$acl_m_lib_ext_type}{MACHINE}{GREYLIST_INITMIN_MACHINE}{GREYLIST_INITMIN_NORMAL}}}}
               set acl_m_grey_initmax  = ${if eq{$acl_m_lib_ext_type}{BOUNCE}{GREYLIST_INITMAX_BOUNCE}{${if eq{$acl_m_lib_ext_type}{MACHINE}{GREYLIST_INITMAX_MACHINE}{GREYLIST_INITMAX_NORMAL}}}}

          # Sai em outros casos levando em consideracao o sender address
	  accept condition = ${if inlisti{$sender_host_address}{${lookup dnsdb{>: defer_lax,a=${lookup dnsdb{>: defer_lax,mxh=${domain:$acl_m_lib_int_addr}}}}}}{yes}{no}}
          # Checa greylist, que retorna "accepted", "deferred" ou "unknown" em acl_m_grey_result, e o id em acl_m_greyuid
          warn  set acl_m_grey_result = ${lookup mysql{GREYLIST_TEST}{$value}{result=unknown}}
    	       # aqui acl_m_grey_result = "result=x id=y"
    	       set acl_m_greyuid = ${extract{id}{$acl_m_grey_result}{$value}{-1}}
               # agora acl_m_greyuid contem o id do registro (ou -1)
               set acl_m_grey_result = ${extract{result}{$acl_m_grey_result}{$value}{unknown}}
               # agora acl_m_grey_result contem unknown/deferred/accepted
          # contagem de accepts
          warn 
               # se acima houve retorno de accept entao aumenta contador. Nao conta duplamente caso tenha havido greylist no rcpt e no data com mesmo endereco
               condition = ${if eqi{$acl_m_grey_result}{accepted}{yes}{no}}
	       condition = ${lookup mysql{GREYLIST_HIT_OK}{yes}}
          # aceita dizendo que tudo esta ok
          accept 
               # se acima houve retorno de accept entao accept e aumenta o tempo de vida de expiracao do registro
               condition = ${if eqi{$acl_m_grey_result}{accepted}{yes}{no}}
	       condition = ${lookup mysql{GREYLIST_LIFETIME_OK}{yes}}
          # checa se conhece o registro, se nao adiciona um
          # checa se foi bloqueado
          warn 
               # se acima houve retorno de deferred entao defer
               condition = ${if eqi{$acl_m_grey_result}{deferred}{yes}{no}}
               # incrementa contagem de defer
               condition = ${lookup mysql{GREYLIST_HIT_DEFER}{yes}}
          # adiciona registro novo com novo bloqueio
          warn
               # se acima retornou unknown (significa que sem registros)
               condition = ${if eqi {$acl_m_grey_result} {unknown}{yes}{no}}
               # adiciona registro grey de espera
               condition = ${lookup mysql{GREYLIST_ADD}{yes}}
          # mensagem de log e de negacao
          warn logwrite  = :reject: H=$sender_rcvhost GrayListed $acl_m_lib_ext_type: message from <$acl_m_lib_ext_addr> to <$acl_m_lib_int_addr>
          deny message 	 = GrayListed ${lc:$acl_m_lib_ext_type}: please try again later to send message from <$acl_m_lib_ext_addr> to <$acl_m_lib_int_addr>
.endif

#--------------------------------------------------------------------------------------------------------------------
#-Clausula LogList (ocorre no rcpt e no data):
.ifdef LOGLIST_ENABLED
 loglist_libs_acl:
	  # limpa registros do loglist as 00 e 30 minutos de todas as horas do dia (somente se por acaso houver delivery neste horario)
	  warn condition  = ${if or {{eqi {${substr{10}{2}{$tod_zulu}}}{00}}{eqi {${substr{10}{2}{$tod_zulu}}}{30}}}{yes}{no}}
 	      set acl_m_logcleanup = ${lookup mysql{LOGLIST_CLEAN}}

	  #Biblioteca Generica
	  deny !acl      = fromto_lib_acl
	  #Sair se vazio
	  deny condition = ${if def:acl_m_lib_int_addr {no}{yes}}
	  deny condition = ${if def:acl_m_lib_ext_addr {no}{yes}}
	  #Se do mesmo dominio, sai fora
          deny condition = ${if eq {${domain:$acl_m_lib_int_addr}}{${domain:$acl_m_lib_ext_addr}}{yes}{no}}

          # Checa loglist, que retorna "accepted", "deferred" ou "unknown" em acl_m_log_result, e o id em acl_m_log_uid
          warn  set acl_m_log_result = ${lookup mysql{LOGLIST_TEST}{$value}{result=unknown}}
    	       # aqui acl_m_log_result = "result=x id=y"
    	       set acl_m_log_uid = ${extract{id}{$acl_m_log_result}{$value}{-1}}
               # agora acl_m_log_uid contem o id do registro (ou -1)
               set acl_m_log_result = ${extract{result}{$acl_m_log_result}{$value}{unknown}}
               # agora acl_m_log_result contem unknown/deferred/accepted

          # Retorna resultado numerico de contagem
          warn set acl_m_cntresult = ${lookup mysql{LOGLIST_CNT}{$value}{result_int=0 result_ext=0}}
    	       # aqui acl_m_cntresult = "result=x id=y"
               set acl_m_cnt_int = ${extract{result_int}{$acl_m_cntresult}{$value}{0}}
               set acl_m_cnt_ext = ${extract{result_ext}{$acl_m_cntresult}{$value}{0}}
               # agora acl_m_cnt_int e acl_m_cnt_ext contem 0,1,2...

	  #Aceitar no resto
	  accept

 loglist_cont_int_acl:
	  #Nega se algo der errado nas pesquisas
	  deny !acl        = loglist_libs_acl
	  #Comparar com contagem maior que zero
          accept condition = ${if >{$acl_m_cnt_int}{0}{yes}{no}}
	  #Aceita se interno, nega se externo
          deny   condition = ${if or {{def:acl_m_lib_cliauth}{def:acl_m_lib_clihost}}{no}{yes}}

 loglist_updt_acl:
	  #Nega se algo der errado nas pesquisas 
	  deny !acl     = loglist_libs_acl

	  #Calculos minimo e maximo
	  warn
            set acl_m_log_initmin  = ${if eq{$acl_m_lib_ext_type}{BOUNCE}{LOGLIST_INITMIN_BOUNCE}{${if eq{$acl_m_lib_ext_type}{MACHINE}{LOGLIST_INITMIN_MACHINE}{LOGLIST_INITMIN_NORMAL}}}}
            set acl_m_log_initmax  = ${if eq{$acl_m_lib_ext_type}{BOUNCE}{LOGLIST_INITMAX_BOUNCE}{${if eq{$acl_m_lib_ext_type}{MACHINE}{LOGLIST_INITMAX_MACHINE}{LOGLIST_INITMAX_NORMAL}}}}

          # contagem de accepts caso ja exista
          warn condition = ${if eqi{$acl_m_log_result}{accepted}{yes}{no}}
	       condition = ${lookup mysql{${if or {{def:acl_m_lib_cliauth}{def:acl_m_lib_clihost}}{LOGLIST_HIT_INT_OK}{LOGLIST_HIT_EXT_OK}}}{yes}}

          # adiciona registro de passagem externa ou interna caso nao exita nada ainda
          warn  condition = ${if eqi{$acl_m_log_result}{accepted}{no}{yes}}
		condition = ${lookup mysql{${if or {{def:acl_m_lib_cliauth}{def:acl_m_lib_clihost}}{LOGLIST_ADD_INT}{LOGLIST_ADD_EXT}}}{yes}}

	  # Logar loglist aceitando externamente apenas para externos!!!
          #warn condition = ${if eqi{$acl_m_log_result}{accepted}{yes}{no}}
	  #     condition = ${if or {{def:acl_m_lib_cliauth} {def:acl_m_lib_clihost}}{no}{yes}}
	  #     logwrite  = :main: Loglisted $acl_m_log_result $acl_m_lib_ext_type: message from <$acl_m_lib_ext_addr> to <$acl_m_lib_int_addr> H=$sender_rcvhost

	  #Sempre nega internamente
          #deny  condition = ${if or {{def:acl_m_lib_cliauth} {def:acl_m_lib_clihost}}{yes}{no}}

          accept condition = ${if eqi{$acl_m_log_result}{accepted}{yes}{no}}
	  deny
.endif
  
