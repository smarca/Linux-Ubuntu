  local_parts 		= echo : ping
  domains 		= +machine_domains : +local_domains : +alias_domains
  senders		= !: !+machine_senders : !+bounce_senders
  transport 		= echo_autoreply
  condition 		= ${if eqi {$h_auto-submitted:}{}{true}fail}

#-Retorna automaticamente uma mensagem de entrega do email caso com confirmacao de leitura
return_receipt_to:
  driver 		= accept
  local_parts           = !: ^SIGN_PREFIX=*
  #condition 		= ${if or {{!eqi {$h_return-receipt-to:}{}}{!eqi {$h_disposition-notification-to:}{}}{!eqi {$h_x-confirm-reading-to:}{}}}{true}fail}
  condition 		= ${if !eqi{$h_return-receipt-to:}{}{true}{fail}}

  transport 		= receipt_autoreply
  senders		= !${domain} :! : !+machine_senders : !+bounce_senders
  domains 		= +local_domains : +alias_domains : +machine_domains
  unseen

