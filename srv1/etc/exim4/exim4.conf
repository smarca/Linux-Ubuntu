begin authenticators

#==================================
# Como servidor!
#==================================
# SERVIDOR LOGIN: codificacao em md5-encoded com usado pelo Outlook Express
server_login:
  #server_advertise_condition = ${if eq{$tls_cipher}{}{}{*}}
  server_advertise_condition = 1 
  driver 		= plaintext
  public_name 		= LOGIN
  server_prompts 	= "Username:: : Password::"
.ifdef MYSQL_SERVER
  server_condition 	= "${if eq {${if match{$auth1}{@}{yes}{no}}}{yes}\
    {${if and{\
	{!eq {$auth1}{}} {!eq {$auth2}{}} \
	{eq {${lookup mysql {MYSQL_PASSWD_MD5_LOGIN}{$value}{*:*}}}{${md5:$auth2}}} \
      }{yes}{no}}}\
      {${if pam{$auth1:${sg{$auth2}{:}{::}}}{yes}{no}}}}"
  server_set_id 	= ${address:$auth1}
  #server_set_id 	= ${extract {1}{@%!}{$auth1}}@${extract {2}{@%!}{$auth1}}
.else
  server_condition      = ${if pam{$auth1:${sg{$auth2}{:}{::}}}{yes}{no}}
  server_set_id 	= ${address:$auth1}
.endif

