.ifdef VERP_ROUTER
  #Envia o return-path de uma maneira diferente, semelhante ao mailman
  verp_delivery:
     driver   		= smtp
     return_path 	= ${local_part:$return_path}+$local_part=$domain@${domain:$return_path}
     max_rcpt 		= 1
.endif

#-Assinatura para emails redirecionados para fora, evitando assim problemas de SPF e outros
sign_delivery:
  driver        = smtp
  debug_print   = "T: sign_delivery from <$sender_address> for <$local_part@$domain> on $host [$host_address]"
  .ifdef SIGN_PASS
      max_rcpt       = 1
      return_path    = SIGN_PREFIX=${lc:${hash_SIGN_SIZE:${hmac{SIGN_HASH}{${length_SIGN_DATESIZE:$tod_zulu}SIGN_PASS}{\
                                ${lc:${if def:sender_address{$sender_address_domain=$sender_address_local_part}{${domain:$h_from:}=${local_part:$h_from:}}}=$domain=$local_part}\
                                }}}=${if def:sender_address{$sender_address_domain=$sender_address_local_part}{${domain:$h_from:}=${local_part:$h_from:}}}@SIGN_DOMAIN}
  .endif
   #$sending_ip_address / $received_ip_address
   #.ifdef BYPASS_NHEADER
   #      headers_add 	= ${if !def:h_BYPASS_NHEADER: {\
   #			    BYPASS_NHEADER: srv=${primary_hostname} id=${message_exim_id} md5=${hmac{md5}{BYPASS_PASS}{${primary_hostname},$body_linecount,${message_exim_id},$h_message-id:}} sha1=${hmac{sha1}{BYPASS_PASS}{${primary_hostname},$body_linecount,${message_exim_id},$h_message-id:}}\
   #			  }}
   #.endif
  #Fallback apenas apos FALLBACK_TIME
  .ifdef FALLBACK_HOSTS
      fallback_hosts 	= ${if >= {$message_age}{FALLBACK_TIME}{FALLBACK_HOSTS}{}}
  .endif
  #Domain Key
  .ifdef ADD_DKNEW
     dkim_domain  	= ${lc:${sender_address_domain}}
     dkim_selector 	= ${lookup dnsdb{>: defer_never,txt=cur._domainkey.${sender_address_domain}}}
     .ifdef ADD_DKHDR
     dkim_sign_headers 	= ADD_DKHDR
     .endif
     dkim_private_key   = ${if exists{/etc/exim4/dkim/${dkim_domain}.${dkim_selector}.private.key}{/etc/exim4/dkim/${dkim_domain}.${dkim_selector}.private.key}{false}}
     dkim_canon 	= relaxed
  .endif

#Assina os emails de saida. Todos, evitando spam por bounce. Se eles saem autenticados, devem retornar autenticados tambem
batv_delivery:
  driver 		= smtp
  debug_print   	= "T: batv_delivery from <$sender_address> for <$local_part@$domain> on $host [$host_address]"
  headers_remove 	= errors-to
  hosts_randomize	= true
  .ifdef BATV_PASS
      return_path = BATV_PREFIX=${hash_BATV_SIZE:${hmac{BATV_HASH}{${length_BATV_DATESIZE:$tod_zulu}BATV_PASS}{\
                            ${lc:${local_part:${if def:sender_address{$sender_address}{$h_from:}}}}=\
			    ${lc:${domain:${if def:sender_address{$sender_address}{$h_from:}}}}}}}=\
		${lc:${local_part:${if def:sender_address{$sender_address}{$h_from:}}}@\
		         ${domain:${if def:sender_address{$sender_address}{$h_from:}}}}
  .endif
  #.ifdef BYPASS_NHEADER
  #      headers_add 	= ${if !def:h_BYPASS_NHEADER: {\
  #			    BYPASS_NHEADER: srv=${primary_hostname} id=${message_exim_id} md5=${hmac{md5}{BYPASS_PASS}{${primary_hostname},$body_linecount,${message_exim_id},$h_message-id:}} sha1=${hmac{sha1}{BYPASS_PASS}{${primary_hostname},$body_linecount,${message_exim_id},$h_message-id:}}\
  #			}}
  #.endif
  #Fallback apenas apos FALLBACK_TIME
  .ifdef FALLBACK_HOSTS
      fallback_hosts 	= ${if >={$message_age}{FALLBACK_TIME}{FALLBACK_HOSTS}{}}
  .endif
  #Domain Key
  .ifdef ADD_DKNEW
     dkim_domain  	= ${lc:${sender_address_domain}}
     dkim_selector 	= ${lookup dnsdb{>: defer_never,txt=cur._domainkey.${sender_address_domain}}}
     .ifdef ADD_DKHDR
     dkim_sign_headers 	= ADD_DKHDR
     .endif
     dkim_private_key   = ${if exists{/etc/exim4/dkim/${dkim_domain}.${dkim_selector}.private.key}{/etc/exim4/dkim/${dkim_domain}.${dkim_selector}.private.key}{false}}
     dkim_canon 	= relaxed
  .endif

#-Dominios internos ou sem assinatura
nosign_delivery:
  debug_print   	= "T: nosign_delivery from <$sender_address> for <$local_part@$domain> on $host [$host_address]"
  driver 		= smtp
  # helo_data 		= ${lookup dnsdb{ptr=$sending_ip_address}{$value}{$primary_hostname}}
  hosts_randomize 	= true
  return_path		= ${if def:return_path {${address:$return_path}}{${if def:sender_address {${address:$sender_address}}{${address:$h_From:}}}}}
  #Domain Key
  .ifdef ADD_DKNEW
     dkim_domain  	= ${lc:${sender_address_domain}}
     dkim_selector 	= ${lookup dnsdb{>: defer_never,txt=cur._domainkey.${sender_address_domain}}}
     .ifdef ADD_DKHDR
     dkim_sign_headers 	= ADD_DKHDR
     .endif
     dkim_private_key   = ${if exists{/etc/exim4/dkim/${dkim_domain}.${dkim_selector}.private.key}{/etc/exim4/dkim/${dkim_domain}.${dkim_selector}.private.key}{false}}
     dkim_canon 	= relaxed
  .endif
  #max_rcpt 		= 200
  #connection_max_messages = 1000
  #delivery_date_add
  #envelope_to_add
  #return_path_add

.ifdef MYSQL_SERVER
#-Usuario para dominios virtuais
virtual_delivery:
  driver 		= appendfile
  directory 		= ${lookup mysql{MYSQL_DIRECTORY}{$value}fail}
  user      		= ${lookup mysql{MYSQL_UID}{$value}fail}
  group     		= ${lookup mysql{MYSQL_GID}{$value}fail}
  maildir_use_size_file = true
  quota     		= ${lookup mysql{MYSQL_QUOTAS}{$value}{256M}}
  quota_filecount  	= ${lookup mysql{MYSQL_QUOTAC}{$value}{1500}}
  maildir_format
  maildir_tag 		= ,S=$message_size
  quota_size_regex 	= ,S=(\d+)
  create_directory
  quota_warn_threshold 	= 75%
  quota_warn_message 	= "\
    To: $local_part@$domain\n\
    X-Priority: 1 (Highest)\nX-MSMail-Priority: High\nImportance: High\n\ 
    Subject: ALERTA: Quota de disco ultrapassada!\n\n\
    Esta mensagem foi automaticamente criada pelo sistema de envio de email.\n\n\
    Sua caixa postal esta cheia.\n\n\
    Por favor remova algumas mensagens, incluindo as da caixa de saida ou itens enviados\n\
    e esvazie sua lixeira para continuar recebendo mensagens de email! \n\n\
    Em caso de duvidas, contacte o administrador.\n"
  mode_fail_narrower = false
  use_fcntl_lock
  use_lockfile
  mode = 0640
  directory_mode = 0700
  delivery_date_add
  envelope_to_add
  return_path_add
  headers_remove 	= BYPASS_NHEADER
.endif

#-Usuario para dominios reais
local_delivery:
  driver 		= appendfile
  directory 		= $home/Maildir
  group 		= mail
  maildir_use_size_file = true
  quota     		= 256M
  quota_filecount 	= 1500
  maildir_format
  maildir_tag 		= ,S=$message_size
  quota_size_regex 	= ,S=(\d+)
  create_directory
  quota_warn_threshold 	= 75%
  quota_warn_message 	= "\
    To: $local_part@$domain\n\
    X-Priority: 1 (Highest)\nX-MSMail-Priority: High\nImportance: High\n\ 
    Subject: ALERTA: Quota de disco ultrapassada!\n\n\
    Esta mensagem foi automaticamente criada pelo sistema de envio de email.\n\n\
    Sua caixa postal esta cheia.\n\n\
    Por favor remova algumas mensagens, incluindo as da caixa de saida ou itens enviados\n\
    e esvazie sua lixeira para continuar recebendo mensagens de email! \n\n\
    Em caso de duvidas, contacte o administrador.\n"
  mode_fail_narrower = false
  use_fcntl_lock
  use_lockfile
  mode = 0640
  directory_mode = 0700
  delivery_date_add
  envelope_to_add
  return_path_add
  headers_remove 	= BYPASS_NHEADER
  ##create_file = MAILDIR_HOME_CREATE_FILE

