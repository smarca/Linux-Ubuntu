begin transports

#Alguns Headers importantes:
#  Priority structure:       
#   X-Priority: 1 (1=High, 3=Normal, 5=Low)
#   X-MSMail-priority=High  (High, Normal, Low)
#   Importance=High (High, Normal, Low)
#   Sensitivity: Private
#  Resposta
#   In-Reply-To: <BANLkTikiT1sOKX+STbd5WtcHDvCb8BVDRA@mail.gmail.com>
#   References: <BANLkTikiT1sOKX+STbd5WtcHDvCb8BVDRA@mail.gmail.com>

#-Email teste, retorna email com headers
echo_autoreply:
  driver 		= autoreply
  once 			= /var/spool/exim4/db/echoreplies
  once_repeat 		= ${if <= {$message_size}{500k}{5m}{15m}}
  once_file_size 	= 5000K
  from	 		= ${local_part}@${domain} 
  reply_to 		= ADDR_POSTMASTER
  to 			= $reply_address
  headers_add		= "In-Reply-To: $h_message-id:\nReferences: $h_message-id:\nX-No-Archive: yes\nAuto-Submitted: auto-replied"
  subject 		= ${if def:h_subject: \
            		    {AutoReflector: ${rfc2047:${quote:${escape:${length_60:$h_subject:}}}}}\
            		    {AutoReflector OK!}\
        		   }
  text 			= "Greetings. Your message reached the autoreflector at $primary_hostname.\
			   \n \
			   \nSender data: \
			   \n - Host: $sender_fullhost :$sender_host_port \
			   \n \
			   \n----------------------------------------------------------------------------------------------\n\
        		    $message_headers"
  #return_message

#-Retorna automaticamente uma mensagem de entrega do email caso com confirmacao de leitura
#-Caso seja uma mensgem grande, possibilita auto retorno mais rapido - a cada 5 minutos
receipt_autoreply:
  driver 		= autoreply
  once_repeat 		= ${if <= {$message_size}{1000k}{5m}{1m}}
  once 			= /var/spool/exim4/db/receipt-to
  once_file_size 	= 5000K
  from 			= ${local_part}@${domain} 
  reply_to 		= ${local_part}@${domain}
  to 			= ${if def:h_return-receipt-to:{${address:$h_return-receipt-to:}}{ \
			  ${if def:h_disposition-notification-to:{${address:$h_disposition-notification-to:}}{ \
			  ${if def:h_x-confirm-reading-to:{${address:$h_x-confirm-reading-to:}}{ \
			  ${if def:h_reply-to:{${local_part:$h_reply-to:}@${domain:$h_reply-to:}}{$reply_address}\
			  }}}}}}}
  headers_add		= "In-Reply-To: $h_message-id:\nReferences: $h_message-id:\nSensitivity: Private\nX-No-Archive: yes\nAuto-Submitted: auto-replied"
  subject 		= ${if def:h_subject: \
            		    {Mensagem Recebida: ${rfc2047:${quote:${escape:${length_60:$h_subject:}}}}}\
            		    {Mensagem Recebida!}\
        		   }
  text 			=    "Sua mensagem foi recebida com sucesso na caixa postal remota <${local_part}@${domain}>\
			    \nEsta nao e uma confirmacao de leitura. Por favor aguarde a confirmacao de abertura e leitura\
			    \nque sera enviada atraves do usuario! Em anexo os cabecalhos da mensagem:\
			    \n \
			    \nYour message was successfully delivered to a distant mailbox <${local_part}@${domain}>\
			    \nThis not is a read confirmation. Please wait to confirmation of open and read message by user!\
			    \nIn attachment, the headers of message:\
			    \n----------------------------------------------------------------------------------------------\n\n\
        		    $message_headers"

