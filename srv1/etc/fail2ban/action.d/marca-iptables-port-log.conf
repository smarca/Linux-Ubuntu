[Definition]

# Option:  actionstart
# Notes.:  command executed once at the start of Fail2Ban.
# Values:  CMD
#
actionstart = iptables -w -N f2b-<name>
              iptables -w -A f2b-<name> -j RETURN
              iptables -w -A <chain> -p <protocol> --dport <port> -j f2b-<name>
              iptables -w -N f2b-<name>-l
	      iptables -w -A f2b-<name>-l -j LOG --log-prefix "Pkt: flag=f2b-<name> " --log-uid --log-tcp-options --log-ip-options -m limit --limit 2/second --limit-burst 10 -m hashlimit --hashlimit-mode srcip,dstip,dstport --hashlimit 1/min --hashlimit-burst 1 --hashlimit-htable-expire 300000 --hashlimit-name f2b-<name>
              iptables -w -A f2b-<name>-l -j DROP

# Option:  actionstop
# Notes.:  command executed once at the end of Fail2Ban
# Values:  CMD
#
actionstop = iptables -w -D <chain> -p <protocol> --dport <port> -j f2b-<name>
             iptables -w -F f2b-<name>
             iptables -w -F f2b-<name>-l
             iptables -w -X f2b-<name>
             iptables -w -X f2b-<name>-l

# Option:  actioncheck
# Notes.:  command executed once before each actionban command
# Values:  CMD
#
actioncheck = iptables -w -n -L <chain> | grep -q 'f2b-<name>' >/dev/null

# Option:  actionban
# Notes.:  command executed when banning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values:  CMD
#
actionban = iptables -w -I f2b-<name> 1 -s <ip> -j f2b-<name>-l 

# Option:  actionunban
# Notes.:  command executed when unbanning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
# Tags:    <ip>  IP address
#          <failures>  number of failures
#          <time>  unix timestamp of the ban time
# Values:  CMD
#
actionunban = iptables -w -D f2b-<name> -s <ip> -j f2b-<name>-log

