# /etc/ntp.conf, configuration for ntpd; see ntp.conf(5) for help

driftfile /var/lib/ntp/ntp.drift 

#interface listen wildcard
interface listen ipv4 
interface ignore eth1:vip

# Enable this if you want statistics to be logged.
#statsdir /var/log/ntpstats/

statistics loopstats peerstats clockstats
filegen loopstats file loopstats type day enable
filegen peerstats file peerstats type day enable
filegen clockstats file clockstats type day enable

# Specify one or more NTP servers.

# Use servers from the NTP Pool Project. Approved by Ubuntu Technical Board
# on 2011-02-08 (LP: #104525). See http://www.pool.ntp.org/join.html for
# more information.
server 0.ubuntu.pool.ntp.org		iburst
server 1.ubuntu.pool.ntp.org		iburst
server 0.pool.ntp.org			iburst
server 1.pool.ntp.org			iburst
server a.st1.ntp.br 			iburst
server b.st1.ntp.br 			iburst
server c.st1.ntp.br 			iburst
server d.st1.ntp.br 			iburst
server gps.ntp.br 			iburst
server a.ntp.br 			iburst
server b.ntp.br 			iburst
server c.ntp.br 			iburst
server br.pool.ntp.org			minpoll 10

#Outros exemplos em caso de desativacao dos acima
#server 10.0.0.1                       	 minpoll 10
#server 2.pool.ntp.org			 iburst
#server 2.ubuntu.pool.ntp.org		 iburst
#server 3.ubuntu.pool.ntp.org		 iburst
#server br.pool.ntp.org                  minpoll 10
#server navobs1.wustl.edu                minpoll 10
#server navobs1.gatech.edu               minpoll 10
#server tick.ucla.edu                    minpoll 10
#server navobs1.oar.net                  minpoll 10
#server tock.usno.navy.mil               minpoll 10
#server usno.pa-x.dec.com                minpoll 10
#server bigben.cac.washington.edu        minpoll 10
#server nist1.datum.com                  minpoll 10
#server time.nist.gov                    minpoll 10
#server time-a.nist.gov                  minpoll 10
#server time-nw.nist.gov                 minpoll 10
#server timekeeper.isi.edu               minpoll 10
#server ntp.nasa.gov                     minpoll 10

# Use Ubuntu's ntp server as a fallback.
server ntp.ubuntu.com

# Access control configuration; see /usr/share/doc/ntp-doc/html/accopt.html for
# details.  The web page <http://support.ntp.org/bin/view/Support/AccessRestrictions>
# might also be helpful.
#
# Note that "restrict" applies to both servers and clients, so a configuration
# that might be intended to block requests from certain clients could also end
# up blocking replies from your own upstream servers.

# By default, exchange time with everybody, but don't allow configuration.
restrict default noquery notrap nomodify nopeer lowpriotrap
restrict -4 default kod notrap nomodify nopeer noquery lowpriotrap
restrict -6 default kod notrap nomodify nopeer noquery lowpriotrap

# Local users may interrogate the ntp server more closely.
restrict 127.0.0.1
restrict ::1

# Clients from this (example!) subnet have unlimited access, but only if
# cryptographically authenticated.
#restrict 192.168.123.0 mask 255.255.255.0 notrust


# If you want to provide time to your local subnet, change the next line.
# (Again, the address is an example only.)
#broadcast 192.168.123.255

# If you want to listen to time broadcasts on your local subnet, de-comment the
# next lines.  Please do this only if you trust everybody on the network!
#disable auth
#broadcastclient

#Disable DDOS
disable monitor
