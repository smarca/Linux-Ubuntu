#-------------------------------------------------------------------------------------------------------------------
#http://www.linuxrapido.org/modules.php?name=Sections&op=viewarticle&artid=93
#TLSCACertificateFile, TLSDHParamFile, TLSDSACertificateFile, TLSDSACertificateKeyFile, TLSRSACertificateFile, TLSRSACertificateKeyFile, TLSRequired
<IfModule mod_tls.c>
      TLSEngine on
      # TLSRequired on
      TLSLog /var/log/proftpd/xferlog.tls
      TLSProtocol SSLv23 
      TLSRSACertificateFile     /etc/ssl/crt/server/monital.crt
      TLSRSACertificateKeyFile  /etc/ssl/crt/server/monital.rsa.key
      TLSDHParamFile		/etc/ssl/crt/server/monital.dh
      TLSVerifyClient on
</IfModule>
