#Ver capacidades em "proftpd -l"

# Includes DSO modules
Include /etc/proftpd/modules.conf


#-[Servidor]-----------------------------------------------------------------------------------------------
Port				21
ServerName			"Monital"
ServerType 			standalone
DefaultServer			on
ServerAdmin			suporte
UseReverseDNS 			on
MaxInstances 			30
WtmpLog 			on
LogFormat  			default "%h %l %u %t \"%r\" %s %b"
LogFormat  			auth    "%v [%P] %h %t \"%r\" %s"
LogFormat  			write   "%h %l %u %t \"%r\" %s %b"
MultilineRFC2228 		on
PassivePorts 			49152 65534
ServerIdent                     on      "Servidor de Ftp Monital Alarmes"
UseIPv6                     off
TransferLog /var/log/proftpd/xferlog
SystemLog   /var/log/proftpd/proftpd.log
#ExtendedLog /var/log/proftpd.access WRITE,READ write
#ExtendedLog /var/log/proftpd.auth AUTH auth
#ExtendedLog /var/log/proftpd.all ALL default


# Uncomment this if you are using NIS or LDAP via NSS to retrieve passwords:
# PersistentPasswd              off

# This is required to use both PAM-based authentication and local passwords
# AuthOrder                     mod_auth_pam.c* mod_auth_unix.c

# Delay engine reduces impact of the so-called Timing Attack described in
# http://www.securityfocus.com/bid/11430/discuss
# It is on by default..

<IfModule mod_delay.c>
DelayEngine on
</IfModule>

<IfModule mod_ctrls.c>
ControlsEngine        off
ControlsMaxClients    2
ControlsLog           /var/log/proftpd/controls.log
ControlsInterval      5
ControlsSocket        /var/run/proftpd/proftpd.sock
</IfModule>

<IfModule mod_ctrls_admin.c>
AdminControlsEngine off
</IfModule>

# Alternative authentication frameworks
#Include /etc/proftpd/ldap.conf
#Include /etc/proftpd/sql.conf

# This is used for FTPS connections
#Include /etc/proftpd/tls.conf

# Useful to keep VirtualHost/VirtualRoot directives separated
#Include /etc/proftpd/virtuals.con

#Incluir outros
#Include /etc/proftpd/conf.d/
#-[Globais]-----------------------------------------------------------------------------------------------
<Global>
    <IfModule mod_quotatab.c>
    QuotaEngine off
    # QuotaType 			soft|hard
    </IfModule>

    <IfModule mod_ratio.c>
    Ratios off
    </IfModule>
    ShowSymlinks                on
    ListOptions                 "-l"
    TimesGMT			off
    
    IdentLookups 		off
    DefaultTransferMode 	binary
    
    RootLogin 			off
    LoginPasswordPrompt 	on
    RequireValidShell 		on
    UseLastlog 			on
    
    #RLimitCPU, RLimitMemory, RLimitOpenFiles

    User                            proftpd
    Group                           nogroup
    #AuthOrder mod_pam.c mod_mysql.c (proftpd -l)

    AllowOverwrite		on
    AllowRetrieveRestart 	on
    AllowStoreRestart 		on
    DeleteAbortedStores 	on

    DeferWelcome		on
    DisplayConnect    		/etc/proftpd/proftpd.login
    DisplayReadme               README
    DisplayLogin                /etc/proftpd/proftpd.welcome
    DisplayQuit                 /etc/proftpd/proftpd.logout

    SetEnv TZ :/etc/localtime

    UseFtpUsers 		on
    CDPath    			~/public_html
    #PathDenyFilter 		"(\\.ftpaccess)|(\\.htaccess)|(\\.htpasswd)$"
    #DenyFilter                 \*.*/

    #LeechRatioMsg 		" "
    AccessDenyMsg		"Login negado para o usuario %u."
    AccessGrantMsg		"Login efetuado com sucesso ao usuario %u."
    Umask			136 026

    DefaultRoot 		~ !marca

    TimeoutStalled 		150
    TimeoutNoTransfer 		600
    TimeoutIdle 		1200
    TimeoutLogin         	120
    MaxLoginAttempts            3
    MaxClients			50 "Desculpe, o número máximo de conexões simultâneas já foi atingido (%m). Tente mais tarde."
    MaxClientsPerHost		 5 "Você já está com muitas conexões simultâneas deste host (%m)."
    MaxClientsPerUser		 5 "Você já está com muitas conexões simultâneas deste usuario (%m)."
    MaxHostsPerUser		 3 "Você já está com muitas conexões de diferentes hosts (%m) deste usuario."

    MaxRetrieveFileSize		 1 Gb
    MaxStoreFileSize 		 1 Gb

</Global>

#-[Login]-----------------------------------------------------------------------------------------------
<Limit LOGIN>
    Order 			Allow,Deny
    Allow from 			186., 187., 189., 191., 200., 201., 143., 10., 172.16., 192.168., 127.0.0., 143., 177. 179. 
    Deny from 			all
</Limit>

#-[Directory]-----------------------------------------------------------------------------------------------

<Directory /*>
    AllowOverwrite          	on
    HideNoAccess                on
    <Limit WRITE>
    	DenyAll
    </Limit>
</Directory>

<Directory /home/*>
    <Limit WRITE>
    	AllowAll
    </Limit>
</Directory>

<Directory /srv/smb/bkup/Suporte/*>
    <Limit WRITE>
    	AllowAll
    </Limit>
</Directory>

<Directory ~/Maildir>
    <Limit WRITE>
    	DenyAll
    </Limit>
</Directory>

<Directory /srv/www/*>
    Umask               136 026
    <Limit WRITE>
    	AllowAll
    </Limit>
</Directory>

<Directory /srv/smb/mult/*>
    <Limit WRITE>
    	AllowAll
    </Limit>
    AllowStoreRestart 	off
    Umask		111 000
    DirFakeGroup 	On ftp
    DirFakeUser		On ftp
    GroupOwner		nogroup
</Directory>

