# Remover o arquivo 50-default.conf
# Cuidado: ajustar o arquivo /etc/logrotate.d/marca
# %fromhost-ip%_%$YEAR%-%$MONTH%-%$DAY%.log


:msg,contains," Pkt: flag=i "				-/var/log/firewall/firewall-invalid.log
& stop
:msg,contains," Pkt: "					-/var/log/firewall/firewall.log
& stop

:syslogtag,contains,"upnpd"				-/var/log/upnpd/upnpd.log
& stop

:syslogtag,contains,"CRON"				-/var/log/cron/cron.log
& stop
cron.*                         				-/var/log/cron/cron.log
& stop

mail.err                        			-/var/log/mail/mail.err
& stop
mail.*                          			-/var/log/mail/mail.log
& stop

:msg,contains,"horde"					-/var/log/horde/horde.log
& stop
:syslogtag,contains,"HORDE"				-/var/log/horde/horde.log
& stop

:syslogtag,contains,"smartd"				-/var/log/smartd/smartd.log
& stop

:msg,contains,"martian source"				-/var/log/firewall/martian.log
& stop
:msg,contains,"ll header"				-/var/log/firewall/martian.log
& stop

auth,authpriv.*                 			/var/log/auth.log
& stop

:msg, regex, "balance.*pool"                            		stop
:msg, regex, "upnpapi.*gethandleinfo.*handletable.*is.*null" 		stop
:syslogtag,contains,"dhcpd"				/var/log/dhcpd/dhcpd.log
& stop
:msg, regex, "info.*client.*signer.*localnet.*approved" -/var/log/dhcpd/dhcpd.log
& stop

:syslogtag,contains,"named"				-/var/log/named/startup.log
& stop

:syslogtag,contains,"rsync"				-/var/log/rsync/rsyncd.log
& stop

kern.*                          			-/var/log/kern.log
& stop

*.emerg                                			:omusrmsg:*
& stop

#Bash commands PROMPT_COMMAND='RETRN_VAL=$?;logger -p local6.debug "$(id -un) [$$] $@ ($RETRN_VAL) bashcmd: $(history 1 | sed "s/^[ ]*[0-9]\+[ ]*//" )"' ; HISTCONTROL='ignoredups'
:msg,contains,"bashcmd" 				-/var/log/commands/commands.log
& stop

:syslogtag,contains,"smbd_audit" 			-/var/log/samba/log.audit
& stop

#Ultimo *.*
*.*;auth,authpriv.none          			-/var/log/syslog
& stop





