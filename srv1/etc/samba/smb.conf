[bkup]
    volume = "BKUP"
    comment = Diretorio BACKUP
    path = /srv/smb/bkup
    writeable = yes
    browseable = yes
    valid users = @adm metropol socio gerencia comercial
    write list = socio
    force user = metropol
    force group = users
    create mask = 0664
    directory mask = 0775

