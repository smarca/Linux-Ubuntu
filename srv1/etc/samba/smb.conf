[suporte]
    volume = "SUPORTE"
    comment = Diretorio SUPORTE
    path = /srv/smb/prog/Suporte
    writeable = yes
    browseable = yes
    valid users = suporte
    write list  = suporte
    force user = suporte
    force group = users
    create mask = 0644
    directory mask = 0755
    vfs objects = full_audit
    full_audit:success = connect, disconnect, open, write, pwrite, link, unlink, rename, mkdir, rmdir, chmod, chown
    full_audit:failure = connect
    # follow symlinks = yes
    # admin users = @adm
    # max connections = 10
    acl allow execute always = yes

[recycle]
    volume = "Lixeira"
    comment = Diretorio Lixeira
    path = /srv/smb/recycle
    writeable = no
    browseable = yes
    valid users = socio
    force user = socio
    force group = users

[socio]
    volume = "SOCIO"
    comment = Diretorio SOCIO
    path = /srv/smb/socio
    writeable = yes
    browseable = yes
    valid users = socio 
    write list  = socio
    force user = socio
    force group = users
    create mask = 0664
    directory mask = 0775
    vfs objects = recycle

[gerencia]
    volume = "GERENCIA"
    comment = Diretorio GERENCIA
    path = /srv/smb/gerencia
    writeable = yes
    browseable = yes
    valid users = socio gerencia
    write list  = socio gerencia
    force user = gerencia
    force group = users
    create mask = 0664
    directory mask = 0775
    vfs objects = recycle

[comercial]
    volume = "COMERCIAL"
    comment = Diretorio COMERCIAL
    path = /srv/smb/comercial
    writeable = yes
    browseable = yes
    valid users = socio gerencia comercial
    write list  = socio gerencia comercial
    force user = comercial
    force group = users	
    create mask = 0664
    directory mask = 0775
    vfs objects = recycle

[prog]
    volume = "PROG"
    comment = Diretorio PROGRAMAS
    path = /srv/smb/prog
    writeable = yes
    browseable = yes
    valid users = @adm metropol socio gerencia comercial
    force user = metropol
    force group = users
    create mask = 0664
    directory mask = 0775
    acl allow execute always = yes

