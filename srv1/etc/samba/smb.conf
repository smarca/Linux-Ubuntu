[global]
   include = /etc/samba/smb.local.conf
   workgroup = Metropol
   server string = Metropol
   security = user
   server role = auto
   server services = smb 

   #RamsomWare Wanna Cry
   nt pipe support = no
  
   hosts allow = 127. 10.
   hosts deny = ALL
   interfaces = eth0
   bind interfaces only = yes
   invalid users = root @root daemon bin sys sync

   #remote browse sync = 10.0.0.1 192.168.1.255
   #remote announce = 192.168.1.255/WORKGROUP
   #remote announce = 172.16.2.255/WORKGROUP

   guest account = metropol
   # restrict anonymous = 2

   load printers = no
   disable spoolss = yes
   printcap name = /dev/null
   # printing = bsd
   # printcap name = /etc/printcap
   # printcap name = cups
   # printing = cups
   # max print jobs = 10
   # show add printer wizard = no

   panic action = /usr/share/samba/panic-action %d
   max log size = 50000
   utmp = no
   logging = file
   log file = /var/log/samba/log-access-%m
   log level = all:1 smb:2 winbind:2 auth:2 passdb:2 lanman:2 tdb:2 sam:2 idmap:2 printdrivers:2 rpc_parse:2 rpc_srv:1 rpc_cli:2 quota:1 acls:1 locking:1 vfs:1 msdfs:1 dmapi:1 registry:1
   debug class = yes
   debug hires timestamp = no
   debug prefix timestamp = yes

   encrypt passwords = true
   username map = /etc/samba/smbusers
   passdb backend = tdbsam:/etc/samba/passdb.tdb

   # smb passwd file = /etc/samba/smbpasswd
   # preload modules = /usr/lib/samba/pdb/mysql.so
   # passdb backend = smbpasswd:/etc/samba/smbpasswd
   # pdbedit -i smbpasswd:smbpasswd -e tdbsam:passdb.tdb
   # obey pam restrictions = yes

   # passdb backend = mysql:localdb smbpasswd:/etc/samba/smbpasswd
   # localdb:mysql host = localhost
   # localdb:mysql user = virtualsambamgr
   # localdb:mysql password = virtualsambapasswd
   # localdb:mysql database = smbbd
   # localdb:lanman pass column = NULL
   # localdb:nt pass column = NULL
   # localdb:plain pass column = plaintext_pw

   unix password sync = yes
   pam password change = yes
   passwd program = /usr/bin/passwd %u
   # passwd chat = *New*password* %n\n *Retype*new*password* %n\n*passwd:*all*authentication*tokens*updated*successfully*
   # passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .

   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_KEEPALIVE
   keepalive = 150
   deadtime = 90
   use sendfile = yes
   # reset on zero vc = yes

   preferred master = auto
   domain master = yes
   local master = yes
   os level = 255
   # lm announce = yes
   browse list = yes
   domain logons = no
   #logon script = %g.bat
   #domain admin group = adm
   #logon home = \\%L\%u\profiles
   #logon path = \\%L\profiles\%u
   #logon drive = h:

   writeable = no
   browseable = yes

   time server = yes
   wins proxy = yes
   max ttl = 86400
   max wins ttl = 86400
   min wins ttl = 3600
   name resolve order = wins host bcast

   message command = /bin/mail -s '%t: %f@%M (%m)' alerta < %s; rm %s &

    #All VFS Objects (vfs objects = full_audit, recycle) : https://www.samba.org/samba/docs/man/Samba-HOWTO-Collection/VFS.html
    # Lixeira : recycle
    recycle:exclude = *.tmp, *.log, *.cdx, *.obj, $*.*, *.$*, ~*.*, *.~* *.bak, *.iso, *.o, *.obj, *.lnk, *.pif, thumbs.db, thumb~i#.dbe
    recycle:exclude_dir = tmp, temp, cache
    recycle:keeptree = yes
    recycle:versions = yes
    recycle:noversions = *.db?, *.iso, *.exe, *.dll, *.com, *.sys, *.cab, *.ms?, *.mp?, *.mpeg, *.aac, *.avi, *.wm?, *.ogg,  *.bmp, *.jpg, *.jpeg, *.gif, *.mov, *.rmvb, *.mkv, *.flv, *.pdf
    recycle:touch = yes
    recycle:touch_mtime = yes
    recycle:minsize = 1024
    recycle:maxsize = 10485760
    recycle:directory_mode = 0775
    recycle:repository = /srv/smb/recycle/%S

    # Auditoria : full_audit
    full_audit:prefix = %u|%m|%I|%P
    full_audit:failure = none
    full_audit:success = none
    full_audit:facility = local6
    full_audit:priority = notice
    #full_audit:success = connect, disconnect, opendir, mkdir, rmdir, closedir, open, close, read, pread, write, pwrite, sendfile, rename, unlink, chmod, fchmod, chown, fchown, chdir, ftruncate, lock, symlink, readlink, link, mknod, realpath
    #full_audit:success = connect, disconnect, opendir, open, close, sendfile, read, pread, write, pwrite, link, unlink, rename, mkdir, rmdir, chmod, chown
    #full_audit:success = write, link, unlink, rename, mkdir, rmdir, chmod, chown

   preserve case = yes
   short preserve case = yes
   default case = lower
   case sensitive = no
   wide links = no
   directory mask = 0750
   create mask = 0640
   delete readonly = no
   hide dot files = no

   #inherit permissions = yes
   #inherit owner = no
   #inherit acls = no

   acl allow execute always = false
   force unknown acl user = yes
     #setfacl -Rb *
     #getfacl /srv/smb/temp/

   #convmv -r -f ISO8859-1 -t UTF-8 --notest .
   dos charset = CP850
   unix charset = UTF-8

   #veto oplock files = /*.mdb/*.dbf/*.ntx/*.cdx/
 
   # https://www.samba.org/samba/docs/man/Samba-HOWTO-Collection/groupmapping.html
   idmap config *  : backend = tdb
   idmap config %L : backend = tdb
   idmap config %D : backend = tdb
   idmap config *  : range = 10000-19999
   idmap config %L : range = 20000-29999
   idmap config %D : range = 30000-39999
   # winbind enum users = yes
   # winbind enum groups = no
   # winbind trusted domains only = no
   # winbind nss info = rfc2307
   csc policy = disable
   hide files = /public_html/
   hide unreadable = yes
   dont descend = /proc,/dev,/etc,/usr,/boot,/bin,/opt,/root,/var,/lib,/sbin
   veto files = /passwd/shadow/.bash*/.alias/.cshrc/.screenrc/.Xdefaults/.xserverrc/
   delete veto files = yes

   # add user script = /usr/sbin/adduser --quiet --disabled-password --gecos "" %u
   # add user script 	= /usr/sbin/useradd -d /dev/null  -c "Maquina %m (%a - %M)" -g maquinas -s /bin/false -M %u
   #delete user script 	= /usr/sbin/userdel '%u'
   #add user script 	= /usr/sbin/useradd -m '%u'
   #delete user script 	= /usr/sbin/userdel -r '%u'
   #add group script 	= /usr/sbin/groupadd '%g'
   #delete group script 	= /usr/sbin/groupdel '%g'
   #add user to group script = /usr/sbin/usermod -G '%g' '%u'
   #add machine script   = /usr/sbin/useradd -n -r -g machines -c "Maquina %m (%a - %M)"  -d /dev/null  -s /bin/false -M %u
   #shutdown script 	= /sbin/shutdown %f %r +%t "Shutdown Start: %m"
   #abort shutdown script = /sbin/shutdown -c "Shutdown Abort: %m"

