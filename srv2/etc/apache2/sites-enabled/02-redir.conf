#Alguns redirecionamentos diretos
<VirtualHost *:80>
    ServerAlias www.metropol.com.br www.monitrace.com.br monital.com.br metropol.com.br monitrace.com.br
    RewriteEngine  on
    RewriteOptions Inherit
    RewriteRule   ^(.+)          http://www.monital.com.br$1
    LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{Referer}i\" \"%{User-Agent}i\"" logrewrite
    CustomLog /var/log/apache2/rewrite_log logrewrite
</VirtualHost>

<VirtualHost *:80>
    ServerAlias monital.net.br
    RewriteEngine  on
    RewriteOptions Inherit
    RewriteRule   ^(.+)          http://www.monital.net.br$1
    LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{Referer}i\" \"%{User-Agent}i\"" logrewrite
    CustomLog /var/log/apache2/rewrite_log logrewrite
</VirtualHost>
<VirtualHost *:80>
    ServerAlias monitoramentoparticipativo.com.br
    RewriteEngine  on
    RewriteOptions Inherit
    RewriteRule   ^(.+)          http://www.monitoramentoparticipativo.com.br$1
    LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{Referer}i\" \"%{User-Agent}i\"" logrewrite
    CustomLog /var/log/apache2/rewrite_log logrewrite
</VirtualHost>


