Alias /painel /srv/www/default/painel/
<Directory "/srv/www/default/painel/">
    RewriteEngine   on
#    RewriteCond %{REMOTE_HOST} !^192.168.*
#    RewriteCond %{REMOTE_HOST} !^172.16.*
#    RewriteCond %{REMOTE_HOST} !^10.*
    RewriteCond     %{HTTPS} !=on
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
    Require ip 10. 192.168. 172.16. 127. 200. 201. 191. 189. 187. 186. 143. 177. 179. 168. 138.
    Require host .localnet .google.com .br
    Require local
    AllowOverride FileInfo AuthConfig Limit 
    <IfModule mod_php5.c>
        AddType application/x-httpd-php .php
	php_admin_flag  engine             "On"
	php_admin_flag  display_errors     "On"
        php_admin_flag  magic_quotes_runtime        "On"
	php_admin_value open_basedir       "/tmp:/srv/www/default/painel"
	php_admin_value error_log          "/tmp/phperr.painel"
	php_admin_value date.timezone      "America/Sao_Paulo"
	#php_admin_flag register_globals     On
    </IfModule>
</Directory>

<Directory "/srv/www/default/painel/lib/">
    Require all denied
</Directory>
