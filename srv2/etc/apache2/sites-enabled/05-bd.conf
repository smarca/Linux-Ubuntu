Alias /bd /usr/share/phpmyadmin
#phpMyAdmin default Apache configuration
#Alias /phpmyadmin /usr/share/phpmyadmin
<Directory "/usr/share/phpmyadmin">
    RewriteEngine   on
    RewriteCond %{REMOTE_HOST} !^192.168.*
    RewriteCond %{REMOTE_HOST} !^172.16.*
    RewriteCond %{REMOTE_HOST} !^10.*
    RewriteCond     %{HTTPS} !=on
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
    <RequireAll>
	<RequireAny>
	    Require ip 10.0.0.0/8
	    Require ip 192.168.0.0/16
	    Require ip 172.16.0.0/12
	    Require local
	    Require ip 200. 201. 191. 189. 187. 186. 143. 177. 179. 168. 138.
	    Require host .localnet .google.com .br
        </RequireAny>
        <RequireAll>
    	    AuthType Digest
    	    AuthName "Painel Password"
	    AuthDigestAlgorithm MD5
	    #htdigest /srv/www/default/access/.htdigest "Painel Password" marca
	    AuthUserFile /srv/www/default/access/.htdigest
	    Require valid-user
	</RequireAll>
    </RequireAll>
    Options +FollowSymLinks +SymLinksIfOwnerMatch
    AllowOverride FileInfo AuthConfig Limit Indexes
    IndexOrderDefault Ascending Name
    IndexOptions FancyIndexing SuppressDescription FoldersFirst NameWidth=* TrackModified
    <IfModule mod_php5.c>
	DirectoryIndex index.php
        AddType application/x-httpd-php .php
        php_flag magic_quotes_gpc Off
        php_flag track_vars On
        php_flag register_globals Off
        php_admin_flag allow_url_fopen Off
        php_value include_path .
        php_admin_value upload_tmp_dir /var/lib/phpmyadmin/tmp
        php_admin_value open_basedir /usr/share/phpmyadmin/:/etc/phpmyadmin/:/var/lib/phpmyadmin/:/usr/share/php/php-gettext/:/usr/share/javascript/
        php_admin_flag  engine                      "On"
	php_admin_flag  safe_mode                   "On"
	php_admin_value error_log                   "/tmp/phperr.www"
	php_admin_flag  safe_mode_gid               "On"
	php_admin_flag  allow_url_fopen             "On"
	php_admin_flag  sql.safe_mode               "Off"
	php_admin_value error_log                   "/tmp/phperr.bd"
	php_admin_flag  file_uploads                "On"
	php_admin_value upload_max_filesize         "128M"
	php_admin_value memory_limit                "128M"
	php_admin_value post_max_size               "128M"
	php_admin_flag  safe_mode   		    "Off"
     </IfModule>
</Directory>

# Authorize for setup
<Directory /usr/share/phpmyadmin/setup>
    <IfModule mod_authn_file.c>
    AuthType Basic
    AuthName "phpMyAdmin Setup"
    AuthUserFile /srv/www/default/access/.htpasswd
    </IfModule>
    Require valid-user
</Directory>

# Disallow web access to directories that don't need it
<Directory /usr/share/phpmyadmin/libraries>
    Require all denied
</Directory>
<Directory /usr/share/phpmyadmin/setup/lib>
    Require all denied
</Directory>



