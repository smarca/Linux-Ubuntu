<VirtualHost *:80>
#    ServerName  stat2.metropol.com.br
#    ServerAlias stat2.monital.com.br
    ServerAlias stat1.* stat2.*
#    ScriptAlias /proxy/online/ "/usr/lib/squid/cachemgr.cgi"
#    Alias /http/images "/usr/share/analog/images"
#    Alias /http/lang "/usr/share/analog/lang"
#    Alias /ftp/images "/usr/share/analog/images"
#    Alias /ftp/lang "/usr/share/analog/lang"
#    Alias /proxy/images "/usr/share/analog/images"
#    Alias /proxy/lang "/usr/share/analog/lang"
    DocumentRoot "/srv/www/default/stat/"
    # CookieTracking off
</VirtualHost>

Alias /stat /srv/www/default/stat/ 
<Directory "/srv/www/default/stat/">
    SetEnv no-gzip dont-vary
    RequestHeader    unset  Accept-Encoding
    FileETag None
    ContentDigest off
    AllowOverride FileInfo AuthConfig Limit Indexes
    IndexOrderDefault Ascending Name 
    Options +Indexes +FollowSymLinks +SymLinksIfOwnerMatch
    IndexIgnore .??* *~
    IndexOptions FancyIndexing SuppressSize SuppressColumnSorting FoldersFirst SuppressIcon TrackModified VersionSort XHTML
    #Require ip 10. 192.168. 172.16. 127. 200. 201. 191. 189. 187. 186. 143. 177. 179. 168. 138.
    #Require host .localnet .google.com .br
    #Require local
    #-- htpasswd -c /srv/www/default/stat/.htpasswd usuario
    #AuthType Basic
    #AuthName "Estatisticas"
    #AuthUserFile /srv/www/default/access/.htpasswd
    #Require valid-user 
    #-- htdigest /srv/www/default/access/.htdigest "Stat Password" usuario
    AuthType Digest
    AuthName "Stat Password"
    AuthDigestAlgorithm MD5
    AuthUserFile /srv/www/default/access/.htdigest
    Require valid-user
    AddDescription "Permissoes dos usuarios (paginas)" 			acessos
    AddDescription "Servidor WWW"                              	 	www
    AddDescription "Servidor Firewall"                        	 	traf
    AddDescription "Maquinas"                                  	 	macs
    AddDescription "Clientes Ativos (Arp)"        			macs/cln_arp.txt
    AddDescription "Clientes Atribuidos (DHCP)"  			macs/cln_dhcp.txt
    AddDescription "Clientes Fixados Manualmente"      			macs/cln_fix.txt 
    AddDescription "Clientes com MAC Filtrados"    			macs/mac_filt.txt
    AddDescription "Clientes com MAC Cadastrados"  			macs/mac_free.txt
    AddDescription "Clientes com IPS Errados"      			macs/ips_err.txt 
    AddDescription "Total de Conexoes por Portas"       		macs/con_total_prt.txt
    AddDescription "Total de Conexoes por Clientes"	       		macs/con_total_cln.txt 
    AddDescription "Total de Conexoes por Clientes x Portas"		macs/con_clnprt.txt
    AddDescription "Estacoes Windows com Compartilhamento Ativo"	macs/smb_hosts.txt
    AddDescription "Estatisticas Gerais" 	    			mrtg
    AddDescription "Estatisticas Gerais -> Comuns (Servidor)"    	mrtg/all
    AddDescription "Estatisticas Testes -> (Radios)"    		mrtg/tst
    AddDescription "Acessos dos usuarios (paginas)" 			proxy
    AddDescription "Acessos dos usuarios (paginas) -> Diarios" 		proxy/daily
    AddDescription "Acessos dos usuarios (paginas) -> Semanais" 	proxy/weekly
    AddDescription "Acessos dos usuarios (paginas) -> Mensais" 		proxy/monthly
    AddDescription "Estatisticas de Email"		 		mail
    # ExpiresDefault "access plus 5 minutes"
    # ExpiresActive On 
    # CookieTracking off
</Directory>

#-----------------------------------------------------------------------------------------------------------
# SQUID
#-----------------------------------------------------------------------------------------------------------
<Directory "/usr/lib/squid/">
    #Require ip 10. 192.168. 172.16. 127. 
    #Require host .localnet
    #Require local
    #-- htpasswd -c /srv/www/default/stat/.htpasswd usuario
    AuthType Basic
    AuthName "Estatisticas"
    AuthUserFile /srv/www/default/access/.htpasswd
    Require valid-user 
    <Files "cachemgr.cgi">
	Options +ExecCGI
    </Files>
</Directory>

#-----------------------------------------------------------------------------------------------------------
# ANALOG
#-----------------------------------------------------------------------------------------------------------
<Directory "/usr/share/analog/">
    #Require ip 10. 192.168. 172.16. 127. 200. 201. 189. 187. 186. 143. 177. 179.
    #Require host .localnet .google.com
    #Require local
    #-- htpasswd -c /srv/www/default/stat/.htpasswd usuario
    AuthType Basic
    AuthName "Estatisticas"
    AuthUserFile /srv/www/default/access/.htpasswd
    Require valid-user 
</Directory>

#-----------------------------------------------------------------------------------------------------------
# MRTG
#-----------------------------------------------------------------------------------------------------------
#MRTG
Alias /mrtg/mrtg-l.gif "/srv/www/default/html/mrtg/mrtg-l.gif"
Alias /mrtg/mrtg-l.png "/srv/www/default/html/mrtg/mrtg-l.png"
Alias /mrtg/mrtg-m.gif "/srv/www/default/html/mrtg/mrtg-m.gif"
Alias /mrtg/mrtg-m.png "/srv/www/default/html/mrtg/mrtg-m.png" 
Alias /mrtg/mrtg-r.gif "/srv/www/default/html/mrtg/mrtg-r.gif"
Alias /mrtg/mrtg-r.png "/srv/www/default/html/mrtg/mrtg-r.png"
Alias /mrtg/mrtg-ti.gif "/srv/www/default/html/mrtg/mrtg-ti.gif"
Alias /mrtg/mrtg-ti.png "/srv/www/default/html/mrtg/mrtg-ti.png"

<Directory "/srv/www/default/stat/mrtg/">
    <FilesMatch "\.(log|old|rrd|txt|meta)$">
	Require all denied
    </FilesMatch>
    # IndexIgnore *.png *.gif ..
    <Files "*-day.png">
	ExpiresActive On 
        ExpiresDefault M300
    </Files>
    <Files "*-week.png">
        ExpiresActive On
        ExpiresDefault M1800
    </Files>
    <Files "*-month.png">
        ExpiresActive On
        ExpiresDefault M7200
    </Files>
    <Files "*-year.png">
        ExpiresActive On
        ExpiresDefault M86400
    </Files>
    <Files "*.html">
        ExpiresActive On
        ExpiresDefault M300
    </Files>
</Directory>

#-----------------------------------------------------------------------------------------------------------
# STATUS Internal
#-----------------------------------------------------------------------------------------------------------

<Location /stat/www/>
    SetHandler server-status
    #Require ip 10. 192.168. 172.16. 127. 200. 201. 189. 187. 186. 143. 177. 179.
    #Require host .localnet .google.com
    #Require local
    #-- htpasswd -c /srv/www/default/stat/.htpasswd usuario
    AuthType Basic
    AuthName "Estatisticas"
    AuthUserFile /srv/www/default/access/.htpasswd
    Require valid-user 
</Location>
ExtendedStatus On


#-----------------------------------------------------------------------------------------------------------
# STATUS NTOP 
#-----------------------------------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName  traf2.metropol.com.br
    ServerAlias traf2.monital.com.br
    SetEnv no-gzip dont-vary
    RequestHeader    unset  Accept-Encoding
    #SetEnv force-proxy-request-1.0 1
    #SetEnv proxy-nokeepalive 1
    LimitInternalRecursion 25
    FileETag None
    ContentDigest off

    <IfModule mod_proxy.c>
        ProxyRequests Off
        ProxyVia Full
        ProxyPreserveHost Off
        ProxyErrorOverride Off
        ProxyPass / http://localhost:3000/
        ProxyPassReverse / http://localhost:3000/
        ProxyPassReverseCookieDomain 192.168.1.1 traf2.metropol.com.br
        <Proxy *>
                AuthType Basic
                AuthName "Estatisticas Interfaces"
                AuthUserFile /srv/www/default/access/.htpasswd
                Require valid-user
                #AddDefaultCharset off
		#Require ip 10. 192.168. 172.16. 127. 200. 201. 189. 187. 186. 143. 177. 179.
		#Require host .localnet .google.com
		#Require local
        </Proxy>
    </IfModule>
</VirtualHost>



