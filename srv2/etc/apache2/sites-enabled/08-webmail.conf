<Directory "/srv/www/default/webmail/">
    Options FollowSymLinks
    AllowOverride FileInfo AuthConfig Limit
    AcceptPathInfo On
    Require ip 10. 192.168. 172.16. 127. 200. 201. 191. 189. 187. 186. 143. 177. 179. 168. 138. 
    Require host .localnet .google.com .br
    Require local
    # INICIO Browser Cache - Velocidade acima de confiabilidade no acesso
    #FileEtag None
    ContentDigest off
    CookieTracking off
    #Log
    <IfModule mod_php5.c>
        AddType application/x-httpd-php .php
        # Flags PHP
        SetEnv PHP_PEAR_SYSCONF_DIR /srv/www/default/webmail/pear/php
        php_admin_flag  engine                      "On"
        php_admin_value safe_mode_include_dir       "/srv/www/default/webmail/lib:/srv/www/default/webmail/pear/php"
        php_admin_value include_path		    "/srv/www/default/webmail/lib:/srv/www/default/webmail/pear/php"
	SetEnv PHP_PEAR_SYSCONF_DIR 		    "/srv/www/default/webmail"
        php_admin_value open_basedir                "/tmp:/srv/www/default/webmail:/var/log/horde"
        php_admin_value session.save_path           "/tmp"
        php_admin_value upload_tmp_dir              "/tmp"
        php_admin_value date.timezone 		 "America/Sao_Paulo"
        php_flag session.auto_start 		 Off
        php_admin_flag  magic_quotes_runtime        "Off"
        php_admin_flag  safe_mode                   "Off"
        php_admin_flag  safe_mode_gid               "Off"
        DirectoryIndex index.php
        php_admin_flag  file_uploads                "On"
        php_admin_value upload_max_filesize         "16M"
        php_admin_value post_max_size               "8M"
        php_admin_value memory_limit                "64M"
        php_admin_flag  allow_url_fopen             "Off"
        php_admin_flag  expose_php                  "Off"
        php_admin_flag  display_errors              "On"
        php_admin_flag  error_reporting             "16383"
        php_admin_flag  track_errors                "On"
        php_admin_flag  log_errors                  "On"
        php_admin_flag  default_charset             "UTF-8"
        php_admin_value max_execution_time          "600"
        php_admin_value max_input_time              "120"
        php_admin_value output_buffering            "4096"
        php_admin_value session.gc_probability 	 "1"
        php_admin_value session.gc_divisor		 "10000"
        php_admin_value error_log                   "/tmp/phperr.webmail"
        php_admin_flag register_globals 		 "Off"
        php_admin_value disable_functions           "system, show_source, symlink, exec, dl, shell_exec, passthru, phpinfo, escapeshellarg, escapeshellcmd"
	#php_admin_flag  track_vars                  "Off"
	#php_admin_flag  magic_quotes_gpc            "On"
	#php_admin_flag  trans_sid                   "Yes"
	#php_admin_flag  short_open_tag              "On"
	#php_admin_flag  session.bug_compat_42       "0"
	#php_admin_flag  session.bug_compat_warn     "1"
	#php_admin_flag  session.use_trans_sid       "Off"
    </IfModule>

    #Rewrite de paginas erradas ou nao
    <IfModule mod_rewrite.c>
    	RewriteEngine On
    	RewriteRule .* - [env=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME}  !-d
    	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME}  !-f
    	RewriteRule ^(.*)$ rampage.php [QSA,L]
    </IfModule>
    #Expirar paginas
    <IfModule mod_expires.c>
	ExpiresActive On
	ExpiresByType image/png "now plus 1 month"
	ExpiresByType image/gif "now plus 1 month"
	ExpiresByType text/javascript "now plus 1 month"
	ExpiresByType application/x-javascript "now plus 1 month"
	ExpiresByType text/css "now plus 1 month"
    </IfModule>
    #Compressao de dados
    Header append Vary User-Agent 
    <IfModule mod_deflate.c>
	<IfModule mod_setenvif.c>
    	    BrowserMatch ^Mozilla/4 gzip-only-text/html
    	    BrowserMatch ^Mozilla/4\.0[678] no-gzip
    	    BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
    	    BrowserMatch \bMSI[E] !no-gzip !gzip-only-text/html
	</IfModule>
	<IfModule mod_headers.c>
    	    Header append Vary User-Agent env=!dont-vary
	</IfModule>
	<IfModule mod_filter.c>
	    AddOutputFilterByType DEFLATE text/richtex text/html text/plain text/xml text/xsd application/xml application/xhtml+xml text/javascript text/css application/x-javascript
	</IfModule>
    </IfModule>
    SetEnvIfNoCase Request_URI \.(?:asf|asx|wax|wmv|wmx|avi|bmp|class|divx|exe|gif|gz|gzip|ico|jpg|jpeg|jpe|mid|midi|mov|qt|mp3|m4a|mp4|m4v|mpeg|mpg|mpe|mpp|ogg|png|ra|ram|swf|tar|tif|tiff|wav|wma|zip)$ no-gzip dont-vary
    <FilesMatch "\.(css|js|html|htm|svg|svgz|xml)$">
	FileETag All
        ContentDigest on
        Header append Cache-Control "proxy-revalidate"
    </FilesMatch>
    <FilesMatch "\.(asf|asx|wax|wmv|wmx|avi|bmp|class|divx|exe|gif|gz|gzip|ico|jpg|jpeg|jpe|mid|midi|mov|qt|mp3|m4a|mp4|m4v|mpeg|mpg|mpe|mpp|ogg|png|ra|ram|swf|tar|tif|tiff|wav|wma|zip)$">
	FileETag All
        ContentDigest off
        Header append Cache-Control "public"
    </FilesMatch>
    <FilesMatch "\.(xls|doc|docx|pdf|txt|rtf|mdb|wri|xla|xls|xlsx|xlt|xlw|odb|odc|odf|odg|odp|ods|odt|pot|pps|ppt|pptx)$">
    	ForceType application/octet-stream
	Header set Content-Disposition attachment
        FileEtag All
        Header append Cache-Control "private"
    </FilesMatch>
    #<FilesMatch "\.(php|phtml|php3|cgi|pl)$">
    #     ExpiresActive Off
    #     Header set Cache-Control "private, no-cache, no-store, proxy-revalidate, no-transform"
    #     Header set Pragma "no-cache"
    #</FilesMatch>
</Directory>

<Directory "/srv/www/default/webmail/admin/">
        <IfModule mod_php5.c>
            AddType application/x-httpd-php .php
    	    php_admin_value open_basedir                "/tmp/..:/tmp:/srv/www/default/webmail:/var/log/horde"
    	    php_admin_value disable_functions           "system, show_source, symlink, exec, dl, shell_exec, passthru, escapeshellarg, escapeshellcmd"
        </IfModule>
</Directory>

