<VirtualHost *:80>
    ServerAlias webmail.* webmail2.* mail.*
    SetEnv no-gzip dont-vary
    RewriteEngine   on
    RewriteCond %{REMOTE_HOST} !^192.168.*
    RewriteCond %{REMOTE_HOST} !^172.16.*
    RewriteCond %{REMOTE_HOST} !^10.*
    RewriteCond     %{HTTPS} !=on
    # RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
    RewriteRule     ^(.*)$ https://webmail.monital.com.br$1 [L,R]
    DocumentRoot "/srv/www/default/webmail"
#   #Alias /Microsoft-Server-ActiveSync /srv/www/default/webmail/rpc.php
    LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{Referer}i\" \"%{User-Agent}i\"" logwebmail
    CustomLog /var/log/apache2/webmail-access.log logwebmail
</VirtualHost>

<IfModule mod_ssl.c>
        <VirtualHost *:443>
            ServerAlias webmail.* webmail2.* mail.*
            SSLEngine on
            # SSLProtocol all
            SSLProtocol -all +TLSv1.2
            # SSLCipherSuite HIGH:MEDIUM
            SSLCipherSuite HIGH
            SSLOptions StrictRequire
            SSLCertificateFile    /etc/ssl/crt/server/monital.crt
            SSLCertificateKeyFile /etc/ssl/crt/server/monital.rsa.key
	    DocumentRoot "/srv/www/default/webmail"
	    #Alias /Microsoft-Server-ActiveSync /srv/www/default/webmail/rpc.php
	    LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{Referer}i\" \"%{User-Agent}i\"" logwebmail
	    CustomLog /var/log/apache2/webmail-access.log logwebmail
    </VirtualHost>
</IfModule>

