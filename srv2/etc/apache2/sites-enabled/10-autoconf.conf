# AddType application/x-ns-proxy-autoconfig .dat .pac
 <VirtualHost *:80>
     DirectoryIndex autodiscover.php
     ServerAlias autoconfig.* autodiscover.*
     DocumentRoot "/srv/www/default/autodiscover/"
     Alias /autodiscover/ "/srv/www/default/autodiscover/"
     HostnameLookups on
     CookieTracking off
     ContentDigest off
     FileETag None
     RewriteEngine On
     RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-d
     RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-f
     RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-l
     RewriteRule . /autodiscover.php [NC,L]
     LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{User-Agent}i\"" logautodiscover
     CustomLog /var/log/apache2/autodiscover.log logautodiscover
 </VirtualHost>
 
 <IfModule mod_ssl.c>
     <VirtualHost *:443>
        SSLEngine on
        SSLProtocol all
        # SSLProtocol -all +TLSv1.2
        SSLCipherSuite HIGH:MEDIUM
        # SSLCipherSuite HIGH
        SSLOptions StrictRequire
        SSLCertificateFile    /etc/ssl/crt/server/monital.crt
        SSLCertificateKeyFile /etc/ssl/crt/server/monital.rsa.key
        ServerAlias autoconfig.* autodiscover.*
        DocumentRoot "/srv/www/default/autodiscover/"
        Alias /autodiscover/ "/srv/www/default/autodiscover/"
        HostnameLookups on
        CookieTracking off
        ContentDigest off
        FileETag None
        RewriteEngine On
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-d
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-f
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-l
	RewriteRule . /autodiscover.php [NC,L]
        LogFormat "%v %h %{cookie}n %t \"%r\" %>s %b %T \"%{User-Agent}i\"" logautodiscover
        CustomLog /var/log/apache2/autodiscover.log logautodiscover
     </VirtualHost>
 </IfModule>
 
# Alias /autodiscover/autodiscover.xml "/srv/www/default/autodiscover/autodiscover.xml"
# Alias /autodiscover.xml "/srv/www/default/autodiscover/autodiscover.xml"

<Directory "/srv/www/default/autodiscover/">
    <IfModule mod_php5.c>
        AddType application/x-httpd-php .php
        php_admin_flag  engine             "On"
        php_admin_flag  display_errors     "On"
        php_admin_value open_basedir       "/tmp:/srv/www/default/autodiscover/"
        php_admin_value error_log          "/tmp/phperr.autodiscover"
        #php_admin_flag register_globals     On
    </IfModule>
    Require all granted
    AllowOverride None
    CookieTracking off
    ContentDigest off
    FileETag None
    ExpiresActive On
    ExpiresDefault M300
</Directory>


