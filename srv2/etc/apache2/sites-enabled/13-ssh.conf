<VirtualHost *:80>
    ServerAlias ssh.* ssl.* ssh1.* ssh2.* ssl1.* ssl2.* 
    RewriteEngine On 
    RewriteCond %{REMOTE_HOST} !^192.168.*
    RewriteCond %{REMOTE_HOST} !^172.16.*
    RewriteCond %{REMOTE_HOST} !^10.*
    RewriteCond %{HTTPS} !=on
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} 
</VirtualHost> 

#http://httpd.apache.org/docs/2.0/ssl/ssl_howto.html
<IfModule mod_ssl.c>
        <VirtualHost *:443>
            ServerAlias ssh.* ssl.* ssh1.* ssh2.* ssl1.* ssl2.*
            SSLEngine on
	    SSLCompression off
            SSLProtocol -all +TLSv1.2
            SSLCipherSuite HIGH
            SSLOptions StrictRequire
            SSLCertificateFile    /etc/ssl/crt/server/monital.crt
            SSLCertificateKeyFile /etc/ssl/crt/server/monital.rsa.key
	    SSLVerifyClient require
	    SSLVerifyDepth 10
	    SSLCACertificateFile /etc/ssl/crt/server/icpbr/ICP-Brasilv2.crt
	    # PeerExtList: 2.16.76.1.3.1 - Pessoa Fisica: Data nascimento, CPF, PIS, RG
	    # PeerExtList: 2.16.76.1.3.4 - Pessoa Juridica: Data nascimento, CPF, PIS, RG
	    # PeerExtList: 2.16.76.1.3.5 - Titulo de eleitor
	    # PeerExtList: 2.16.76.1.3.6 - CEI INSS
            SetEnv CPF PeerExtList("2.16.76.1.3.1")
	    LogFormat   "%h %h %{cookie}n %t \"%r\" %>s %b %T \"%{Referer}i\" \"%{User-Agent}i\" \"%{SSL_CLIENT_S_DN_CN}x\" \"%{SSL_CLIENT_M_SERIAL}x\" " logssh
	    CustomLog /var/log/apache2/ssh.log logssh
	    RewriteEngine   on
	    RewriteCond     %{SSL:SSL_CLIENT_VERIFY} !=SUCCESS
	    RewriteRule     .? - [F]
	    ErrorDocument 403 "Necessario um certificado do lado do cliente para acessar este site!"
	    ProxyRequests Off
    	    <Proxy *>
	        AddDefaultCharset off
		#SSLRequire "foobar" in PeerExtList("1.2.3.4.5.6")
		SSLRequire    %{SSL_CLIENT_S_DN_CN} in {"SILMAR ANTONIO MARCA:12088"} \
		          and %{SSL_CLIENT_S_DN_C} eq "BR"
		SSLRequire %{SSL_CIPHER_USEKEYSIZE} >= 128
		<RequireAll>
    		    <RequireAny>
        		Require ip 10.0.0.0/8
        		Require ip 192.168.0.0/16
        		Require ip 172.16.0.0/12
        		Require local
        		Require ip 200. 201. 191. 189. 187. 186. 143. 177. 179. 168. 138.
        		Require host .localnet .google.com .br
    		    </RequireAny>
	        </RequireAll>
    	    </Proxy>
    	    ProxyPass / http://127.0.0.1:4200/
    	    ProxyPassReverse / http://127.0.0.1:4200/
    </VirtualHost>
</IfModule>
