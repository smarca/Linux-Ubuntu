############################################################################
#FailOver: Primary
   failover peer "localnet" {
         primary;
         address       10.0.0.2;    port      519;
         peer address  10.0.0.1;    peer port 520;
         max-response-delay 60;
         max-unacked-updates 10;
         load balance max seconds 3;
         mclt 3600;
         split 128;
  }
#FailOver: Secondary #next-server 10.0.0.2;
