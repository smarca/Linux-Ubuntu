#Nao implementado
omapi-port 7911;			#Intercomunicacao Failover Status Porta
omapi-key key_int;			#Intercomunicacao Failover Status Key

############################################################################
authoritative;                                                  #Dhcp DHCPNAK Ligado
pid-file-name 				"/var/run/dhcp-server/dhcpd.pid";
log-facility				local0;			#veja syslogd.conf: local0.debug /var/log/dhcpd.log
option ip-forwarding                    off;                    #Forward Ip
option arp-cache-timeout                600;                    #Cache Arp
#use-lease-addr-for-default-route 	on;			#Proxy arp desligado (off), ligado (on)
option default-ip-ttl                   128;                    #TTL
option default-tcp-ttl                  128;                    #TTL
option ieee802-3-encapsulation 		on;			#Novo estilo de protocolo com suporte a "Logical Link Control"
option trailer-encapsulation		on;			#Novo estido de protocolo
option tcp-keepalive-interval           5;                      #Keep alive em segundos
option time-offset                      -10800;                 #Horario UTC -03:00
ping-check                              on;                     #Verifica em uso
ping-timeout				1;			#Timeout de ping
option wpad code 252                    = text ;		#Proxy Automatico

#Tempo Expiracao
if known or static {							#Hosts Conhecidas e Fixas
    default-lease-time 			 864000;			#Default lease = 10 dias
    max-lease-time 			1296000;			#Max lease = 15 dias
} elsif substring(option vendor-class-identifier,0,3) = null {		#Hardwares nao cadastrados ou nao fixos
    default-lease-time 			2592000;			#Default lease = 30 dias
    max-lease-time 			3888000;			#Max lease = 45 dias
} else {								#Outros equipamentos
    default-lease-time 			 864000;			#Default lease = 15 dias
    max-lease-time 			1296000;			#Max lease = 10 dias
}

#Dados extras e log adicional
on commit {
    set info-hardware                               = binary-to-ascii(16, 8, ":", substring(hardware, 1, 6));
    set info-leased-address                         = pick-first-value(binary-to-ascii(10, 8, ".", leased-address),"-");
    set info-vendor-class-identifier                = lcase(pick-first-value(option vendor-class-identifier,"-"));
    set info-host-name                              = lcase(pick-first-value(option host-name,option fqdn.hostname,config-option server.ddns-hostname,host-decl-name,"-"));
    set info-log                                    = concat("hw:<",info-hardware,">, hst:<",info-host-name,">, ip:<",info-leased-address,">, ven:<",info-vendor-class-identifier,"> ");
    log (info, concat("*---[ START REQUEST ]--- ",info-log));
    unset info-hardware;
    unset info-leased-address;
    unset info-vendor-class-identifier;
    unset info-host-name;
    unset info-log;
}
on release {
	log (info, concat("*---[ START RELEASE ]--- ",info-log));
}
on expiry {
	log (info, concat("*---[ START EXPIRY ]--- ",info-log));
}


#Loop IPCONFIG Windows
#@echo off
# :loop
# ipconfig /renew
# timeout 30
#goto loop

#Nome DNS
option domain-name                      "localnet";
ddns-domainname                         "localnet";
ddns-update-style                       interim;
update-static-leases                    off;			#OFF eh o recomendado
ddns-updates                            on;
do-forward-updates			on;
option fqdn.server-update 		on;
option fqdn.no-client-update		off;
option fqdn.encoded 			off;
update-optimization                     off;                    #OFF Refaz o DNS update a cada release
update-conflict-detection 		on;			#Executa update mesmo se o host ja existir, melhor para multiplas interfaces ou troca de maquinas com mesmo hostname
get-lease-hostnames			on;

deny                                    declines;		#Nega atualizacoes de clientes
deny                                    duplicates;		#Evita duplicacao de ips
#deny                                   bootp;                  #Bootp Queries
ignore                                  client-updates;		#Ignora atualizacoes de clientes

one-lease-per-client                    on;			#Um ip por cliente apenas
always-broadcast                        off;			#Sempre via broadcast
#use-host-decl-names 			on;			#Hostname usado (nao funciona direito - usar ddns-hostname)

#MAN dhcp-eval
ddns-hostname     		= lcase(pick-first-value(option host-name,option fqdn.hostname,config-option server.ddns-hostname,host-decl-name,binary-to-ascii(16,8,"-",substring(hardware,1,6))));
option host-name 		= lcase(pick-first-value(option host-name,option fqdn.hostname,config-option server.ddns-hostname,host-decl-name,binary-to-ascii(16,8,"-",substring(hardware,1,6))));
ddns-text                       = binary-to-ascii(16, 8, "-", substring(hardware, 1, 6));
#option dhcp-client-identifier  = lcase(binary-to-ascii(16,8,"-",substring(hardware,1,6)));

#option static-routes 177.220.156.179 10.0.0.2, 200.181.255.36 10.0.0.1;
#option new-static-routes code 201 = array of { ip-address, ip-address, ip-address, integer 8 };
#option new-static-routes
#    177.220.156.179 255.255.255.255 10.0.0.2 1,
#    200.181.255.36 255.255.255.255 10.0.0.1 1;

############################################################################
include "/etc/bind/named.key";
zone localnet. 			{ primary 127.0.0.1;  key key_int; }
zone 10.in-addr.arpa. 		{ primary 127.0.0.1;  key key_int; }
zone 168.192.in-addr.arpa. 	{ primary 127.0.0.1;  key key_int; }
zone 16.172.in-addr.arpa. 	{ primary 127.0.0.1;  key key_int; }
############################################################################
#Hosts IP FIXO
group {
	use-host-decl-names on;
	ping-check off; 
	#host fix-voipATA    { hardware ethernet 00:14:bf:4e:86:02; fixed-address 10.10.0.1; option routers 10.0.0.2; }	#Fixado, mas sem dns automatico
	#host fix-wifi-1     { hardware ethernet 00:17:3F:1A:24:67; fixed-address 10.10.0.2; }		#Fixado, mas sem dns automatico
	#host fix-wifi-2      { hardware ethernet 00:02:6f:a9:57:97; fixed-address 10.10.0.3; }		#Fixado, mas sem dns automatico
	#host cpd-telefonia   { hardware ethernet d0:27:88:a2:b9:a7; fixed-address 10.10.0.30; }	#Tarifador gravador telefonico
        #host cpd-gravadortel { hardware ethernet 00:11:d7:01:74:69; fixed-address 10.10.0.31; }        #Hardware que envia para o Tarifador e gravador telefonico
        #host cpd-boleto     { hardware ethernet 74:e6:e2:d6:56:cd; fixed-address 10.10.0.100; }        #Sistema Boleto
}

#Hosts Bloqueadas de navegacao completa (sem dns)
class "pool-blk-all" {
        #match hardware;
	#match lcase(option host-name);
	match binary-to-ascii(16,8,"-",substring(hardware,1,6));
        option routers                      127.0.0.1;
        option domain-name-servers          127.0.0.1;
        option wpad                         "http://127.0.0.1/blank.htm\000";
        option uap-servers                  "127.0.0.1:3128";
	option default-tcp-ttl 		    1;
	option default-ip-ttl 		    1;
}
subclass "pool-blk-all" "blk-" { }

#Hosts Bloqueadas externo apenas (com dns)
class "pool-blk-int" {
	match binary-to-ascii(16,8,"-",substring(hardware,1,6));
        option routers                      127.0.0.1;
        option wpad                         "http://127.0.0.1/blank.htm\000";
        option uap-servers                  "127.0.0.1:3128";
	option default-tcp-ttl 		    1;
	option default-ip-ttl 		    1;
}
subclass "pool-blk-all" "int-" { }

#http://www.ipamworldwide.com/match-expressions.html
#class "pool-10-20-1" { match if lcase(substring (pick-first-value(option host-name,option fqdn.hostname,config-option server.ddns-hostname), 0, 4)) = "dir-"; }  #
class "pool-10-20-1" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-2" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-3" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-4" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-5" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-6" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-7" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-8" { match substring (lcase (option host-name), 0, 4); }
class "pool-10-20-9" { match substring (lcase (option host-name), 0, 4); }
class "pool-fix-hwd" { match if substring(option vendor-class-identifier,0,3) = null; }
class "pool-fix-aut" { deny  unknown-clients; }
class "pool-fix-man" { deny  unknown-clients; }
class "pool-another" { allow unknown-clients; }

subclass "pool-10-20-1" "dir-" { }
subclass "pool-10-20-2" "ger-" { }
subclass "pool-10-20-3" "adm-" { }
subclass "pool-10-20-4" "com-" { }
subclass "pool-10-20-5" "opr-" { }
subclass "pool-10-20-6" "cpd-" { }

###########################################################################
shared-network NETA {
    subnet 10.0.0.0 netmask 255.0.0.0 {
        authoritative;
	server-name 				"A.localnet";
	ddns-domainname 			"A.localnet";
	option domain-name                      "A.localnet";
	option wpad 	 			"http://proxy.A.localnet/wpad.dat\000";
	server-identifier 			 10.0.0.2;
	option subnet-mask			 255.0.0.0;
        option routers                           10.0.0.2, 10.0.0.1;
        option domain-name-servers               10.0.0.2, 10.0.0.1;
	option ntp-servers               	 10.0.0.2, 10.0.0.1;
	# option uap-servers 			"10.0.0.2:3128";
        # option routers                          10.0.0.2, 10.0.0.1;
        # option domain-name-servers              10.0.0.2, 10.0.0.1;
    	# option netbios-name-servers     	 10.0.0.1;
    	# option netbios-node-type        	 8;
        # option policy-filter 			 10.0.0.1 255.255.255.255;
	pool { range 10.20.0.01  10.20.0.49;  allow members of "pool-blk-all"; failover peer "localnet"; } #dir-
	pool { range 10.20.1.01  10.20.1.49;  allow members of "pool-10-20-1"; failover peer "localnet"; } #ger-
	pool { range 10.20.2.01  10.20.2.49;  allow members of "pool-10-20-2"; failover peer "localnet"; } #adm-
	pool { range 10.20.3.01  10.20.3.49;  allow members of "pool-10-20-3"; failover peer "localnet"; } #com-
	pool { range 10.20.4.01  10.20.4.49;  allow members of "pool-10-20-4"; failover peer "localnet"; } #opr-
	pool { range 10.20.5.01  10.20.5.49;  allow members of "pool-10-20-5"; failover peer "localnet"; } #cpd-
	pool { range 10.20.6.01  10.20.6.49;  allow members of "pool-10-20-6"; failover peer "localnet"; }
	pool { range 10.20.7.01  10.20.7.49;  allow members of "pool-10-20-7"; failover peer "localnet"; }
	pool { range 10.20.8.01  10.20.8.49;  allow members of "pool-10-20-8"; failover peer "localnet"; }
	pool { range 10.20.9.01  10.20.9.49;  allow members of "pool-10-20-9"; failover peer "localnet"; }
        pool { range 10.10.0.01  10.10.0.09;  allow members of "pool-fix-aut"; failover peer "localnet"; deny all clients; } #Hosts Fixas Via MAC por DHCP 
        pool { range 10.10.0.10  10.10.0.99;  allow members of "pool-fix-man"; failover peer "localnet"; deny all clients; } #Hosts Fixas Manualmente Maquinas 
        pool { range 10.10.0.100 10.10.0.120; allow members of "pool-fix-man"; failover peer "localnet"; deny all clients; } #Hosts Fixas Manualmente Servidores Terceiros
        pool { range 10.10.0.121 10.10.0.149; allow members of "pool-fix-hwd"; failover peer "localnet"; } #Hosts Fixas Via DHCP sem fabricante algum (hardware generico geralmente)
        pool { range 10.10.0.150 10.10.0.199; allow members of "pool-another"; failover peer "localnet"; } #Hosts Desconhecidas e com nome estranho
        pool { range 10.10.0.200 10.10.0.250; deny all clients; }    				           #Hosts Fixas Manualmente, impressoras
        pool { range 10.10.1.01  10.10.1.49;  allow unknown-clients; failover peer "localnet"; #Hosts Automaticas dhcp sem padronizacao, sem navegacao alguma!
	    deny members of "pool-blk-int";
	    deny members of "pool-blk-all";
	    deny members of "pool-fix-aut";
	    deny members of "pool-fix-man";
	    deny members of "pool-fix-hwd";
	    deny members of "pool-10-20-1";
	    deny members of "pool-10-20-2";
	    deny members of "pool-10-20-3";
	    deny members of "pool-10-20-4";
	    deny members of "pool-10-20-5";
	    deny members of "pool-10-20-6";
	    deny members of "pool-10-20-7";
	    deny members of "pool-10-20-8";
	    deny members of "pool-10-20-9";
    	    option routers                      127.0.0.1;
    	    option wpad                         "http://127.0.0.1/blank.htm\000";
    	    option uap-servers                  "127.0.0.1:3128";
	    option default-tcp-ttl 		    1;
	    option default-ip-ttl 		    1;
	}
        pool { range 10.0.9.01   10.0.9.254;  deny  unknown-clients; } 			#Forcar renew de antigas
    }    
}

########################################################################
shared-network BLOCKA {
   	 subnet 192.168.1.0 netmask 255.255.255.0 { 
        server-identifier 			 192.168.1.252;
        ignore					 unknown-clients;
        not 					 authoritative;
    }
}

shared-network BLOCKB {
   subnet 177.220.156.176 netmask 255.255.255.248 {
        server-identifier                        177.220.156.179;
        ignore                                   unknown-clients;
        not                                      authoritative;
    }
}










