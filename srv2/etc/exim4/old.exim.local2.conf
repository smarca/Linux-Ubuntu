#-BLK: Nega arquivos em anexos com extensoes perigosas. Apenas para arquivos menores que SIZ_...	
BLK_Executaveis_Type	= yes
SIZ_Executaveis_Mime    = 16M
SIZ_Executaveis_UUEnc	= 150k

#-BLK: Nega links para arquivos com extensoes perigosas. Apenas para arquivos menores que SIZ_...	
BLK_LinkExecutaveis	= yes
SIZ_LinkExecutaveis	= 2M

#-BLK: Nega links com query cgi	(Imagens SPYWARE). Apenas para arquivos menores que SIZ_...
BLK_EmbebedCGI		= yes
SIZ_EmbebedCGI		= 2M

#-BLK: Bloqueia Links falsamente exibidos como se fossem outros
BLK_LinkFakeShow	= yes
SIZ_LinkFakeShow	= 2M

#-BLK: Descarta mensagens de erro ou sender null com anexos. Exceto as extensoes abaixo
EXT_BounceFree_Attach	= txt|htm|html

#-BLK: Descarta mensagens de "From" que sejam tipo maquinas mas sem ser mensagens de erro...
#      Descarta as que tem o from de uma maquina e nao tem assinatura batv valida ou sem headers comuns em caso de falha de mensgens
BLK_MachineNotBounce	= yes

#-BLK: Nega html somente, sem ser multipart
#BLK_HTMLONLY		= yes

#-BLK: Nega bugs do outlook (CLSID, MIme BOundary etc)
BLK_MIMEBUGS		= yes

#-BLK: Nega arquivos em anexos compactados com extensoes perigosas
BLK_ZipExecutaveis	= yes	

#-WRN: Ratelimit (log)
BLK_RATE_AUTHFAIL_HELO	=  20  / 1d
BLK_RATE_AUTHFAIL_IP	=  30  / 1d
DEF_RATE_SYSTEM		=  250 / 5m
BLK_RATE_MAIL		=  100 / 1d
WRN_RATE_RCPT		=  100 / 1d 
WRN_RATE_BYTE		= 500M / 7d 
BLK_DUP_MESSAGEID	=    3 / 7d
BLK_DUP_MESSAGESUB	=    5 / 7d

#-Verp Router estilo mailman
VERP_ROUTER		= "*-bounces@$qualify_domain" : webmaster@$qualify_domain : www@$qualify_domain 

#-NoSign Router Domain - Envia diretamente sem assinar com batv ou sign
NOSIGN_ROUTER		= "noticias@*"

#Mysql tem senhas em branco (1) ou nao (0) - atributo password_clean. Necessario para autenticacoes NTLM/SPA ou CRAM-MD5
USE_MYSQL_PASSWD_CLEAN  = 0

#Apos quanto tempo o fallback funciona. Depois de quanto tempo tentando vai para fallback
FALLBACK_TIME           = 86400

#Depois deste tamanho, apenas envia via modo queue, nao envia na hora...
SIZ_MessageSizeQueueOnly = 8M

