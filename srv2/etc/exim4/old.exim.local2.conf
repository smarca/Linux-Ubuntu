#Os dominios MX recebem apenas em modo QUEUE, significando uma demora a mais para a entrega, que ocorre apenas em lotes
#MX_QueueOnly		= yes

#Aceita recebimento e envio de email do tipo xxxx@[x.x.x.x]
#IPLITERAL		= yes

#Autenticacao DOVECOT, recebimento de emails dovecot
#DOVECOT_AUTH_SEND	= yes

#Autenticacao via PAM (usuarios locais pwd)
PAM_AUTH		=yes

#Tamanho maximo de qualquer mensgem do sistema
MAX_Size_Message	= 64M
MAX_Size_IntRecipients	= 250
MAX_Size_ExtRecipients	= 100

#Bypass chave, aceitando o email sempre! Usar em MX para headers marcados ou helo marcado. DATESIZE = 4 para ano, 6 para ano e mes, 8 para ano mes e dia
BYPASS_NHEADER		= X-Int-Delivery
BYPASS_PASS_MD5		= ypisiliter1
BYPASS_PASS_SHA1	= ypisiliter2
BYPASS_DATESIZE         = 6

#-SRS0 - Reenvio ou forward assinado para dominios externos, evitando bloqueios por SPF ou outros. DATESIZE = 4 para ano, 6 para ano e mes, 8 para ano mes e dia
#-Cuidado, pois cria uma ponte autorizada de comunicacao entre destinatario e remetente atraves do servidor...
#- Sintaxe: SRS0=password=destino.com.br=user@srv2.metropol.com.br (sempre usar SIGN_DOMAIN abaixo. Recomendado $qualify_domain)
SIGN_PREFIX		= SRS0
SIGN_PASS		= ypsiliter
SIGN_SIZE		= 10
SIGN_DATESIZE           = 8
SIGN_HASH		= md5
SIGN_DOMAIN		= $qualify_domain

#-prvs - Assinatura de envio de emails, possibilitando bounce emails seguros sem spam. DATESIZE = 4 para ano, 6 para ano e mes, 8 para ano mes e dia
#- Sintaxe: prvs=password=user@metropol.com.br
BATV_PREFIX		= prvs
BATV_PASS		= ypsiliter
BATV_SIZE		= 10
BATV_DATESIZE           = 8
BATV_HASH		= md5
#74.82.85.0/24 BlackBary Tablet
BATV_HSTPASS		= ${lookup dnsdb{>: defer_never,mxh=monital.net.br}}

#-DEF: Lista GreyList (Defer Temporario)
.ifdef MYSQL_SERVER
 GREYLIST_ENABLED_GREY		= yes
 #Tempo inicial minimo para aceitar
 GREYLIST_INITMIN_NORMAL	= 10 MINUTE
 GREYLIST_INITMIN_MACHINE	= 15 MINUTE
 GREYLIST_INITMIN_BOUNCE	= 10 MINUTE
 #Tempo inicial maximo para aceitar
 GREYLIST_INITMAX_NORMAL	= 60 MINUTE
 GREYLIST_INITMAX_MACHINE	= 90 MINUTE
 GREYLIST_INITMAX_BOUNCE	= 30 MINUTE
 #Tempo maximo do registro sem uso para continuar aceitando
 GREYLIST_LIFETIME_NORMAL	= 10 DAY
 GREYLIST_LIFETIME_MACHINE	= 15 DAY
 GREYLIST_LIFETIME_BOUNCE	= 60 HOUR
 #Tempo apos tempo maximo (somado) que o registro eh definitivamente apagado do banco de dados
 GREYLIST_CLEAR_LIFETIME 	= 120 DAY
.endif

#-BLK-WRN: Verifica SPF policy via DNS TXT (Sender Policy Framework)
#SKP_Spf_LIB			= pass
#BLK_Spf_LIB			= fail 
#FRC_Spf_LIB			= fail : softfail : neutral : err_perm : err_temp
#WRN_Spf_LIB			= pass : softfail : neutral : err_perm : err_temp : unknown

#-BLK-WRN: Verifica SPF policy via PERL (libmail-spf-query-perl)
SKP_Spf_PERL                   = pass
BLK_Spf_PERL                   = fail : softfail : neutral : unknown : error : fakeall
FRC_Spf_PERL                   = fail : softfail : neutral : unknown : error : fakeall
WRN_Spf_PERL                   = pass : softfail : neutral : unknown : error : fakeall

#-BLK-WRN: Verifica DK (Domain Keys)
#BLK_DKOLD 			= yes
#WRN_DKOLD 			= yes
BLK_DKNEW			= yes
ADD_DKNEW			= yes
ADD_DKHDR			= X-Originating-IP:User-Agent:Content-Disposition:From:Sender:Reply-To:Subject:Date:Message-ID:To:Cc:MIME-Version:Content-Type:Content-Transfer-Encoding:Content-ID:Content-Description:Resent-Date:Resent-From:Resent-Sender:Resent-To:Resent-Cc:Resent-Message-ID:In-Reply-To:References:Precedence:X-RT-Loop-Prevention:RT-Ticket:Managed-by:RT-Originator:X-RT-Original-Encoding:List-Unsubscribe
#ORIGINAL:ADD_DKHDR		=                                                 From:Sender:Reply-To:Subject:Date:Message-ID:To:Cc:MIME-Version:Content-Type:Content-Transfer-Encoding:Content-ID:Content-Description:Resent-Date:Resent-From:Resent-Sender:Resent-To:Resent-Cc:Resent-Message-ID:In-Reply-To:References:Precedence:X-RT-Loop-Prevention:RT-Ticket:Managed-by:RT-Originator:X-RT-Original-Encoding

#Headers de Listas
#:List-Unsubscribe:X-Unsubscribe-Web:X-List-Unsubscribe:List-Id:List-Archive:List-Post:List-Subscribe

#-WRN: RBL para identificacao de localidade. Adicionando Header Location
#WRN_Country		= yes

#-SKP: Witelist RBL
#SKP_Rbl_HostSender 		= \
#	nobl.junkemailfilter.com : \
#	white.uribl.com

#-WRN: Header via lista RBL apenas de RFC
#WRN_Rbl_RfcSender	= dsn.rfc-ignorant.org/$sender_address_domain : abuse.rfc-ignorant.org/$sender_address_domain : bogusmx.rfc-ignorant.org/$sender_address_domain

#-WRN: Lista negra RBL para Bloqueio (http://www.openrbl.org/ - http://www.declude.com/junkmail/support/ip4r.htm - http://www.spamcop.net/sc?track=ip.ip.ip.ip)
#http://www.spamcop.net/fom-serve/cache/408.html
#http://www.us.sorbs.net/using.shtml
#http://www.spamhaus.org/faq/section/DNSBL%20Usage
WRN_Rbl_HostIP 		= \
	zen.spamhaus.org : \
	dnsbl.sorbs.net : \
	cbl.abuseat.org : \
	multi.surbl.org : \
	ipbl.mailhosts.org : \
        spam.dnsbl.sorbs.net 

#-WRN: Lista negra para as MX dos dominios do sender: pode ser 
# Exemplo 1: listaDOMINIOS.antispam.com/$sender_address_domain
# Exemplo 2: listaIPS.antispam.com/<|${lookup dnsdb {>|a=<|${lookup dnsdb {>|mxh=$sender_address_domain} }} }
#http://www.spamhaus.org/faq/section/Spamhaus%20DBL#291
WRN_Rbl_Sender		= \
	multi.surbl.org/$sender_address_domain : \
	zen.spamhaus.org/<|${lookup dnsdb {>|a=<|${lookup dnsdb {>|mxh=$sender_address_domain} }} }

#-BLK: RBL para bloqueios IP
BLK_Rbl_HostIP         = \
        bl.spamcop.net : \
        sbl-xbl.spamhaus.org

#-BLK: RBL para bloqueios Sender
BLK_Rbl_Sender 		= \
	dbl.spamhaus.org/$sender_address_domain

#-BLK: Helo com ip nao sendo o proprio ip (Open Proxy)
BLK_HeloOpenProxy 	= yes

#-BLK: Helo eh um ip
BLK_HeloisIP		= yes

#-BLK: Helo informado aponta para o ip da interface acessada, ou dominio local (portanto falsificado)
BLK_FakeToMeHelo	= yes	
#-BLK: Header Message-ID informado aponta para o ip da interface acessada, ou dominio local.(portanto falsificado)
BLK_FakeToMeMsgID	= yes

#-BLK: enderecos Sender, rcpt ou subject com caracteres codificados, tipo ISO-8859-1, UTF-8 ou outros. Apenas o que esta entre os <>. 
BLK_8bit		= yes	

#-BLK: Usuario local com UID muito baixo, ou seja, contas locais
BLK_LOW_UID		= 999

#-BLK: Sender mau formado
BLK_SenderLocalPartInvalid = yes

#BLK: Tamanho maximo do sender
BLK_MaxSize_Sender	= 120

#-BLK: Recipient mau formado
BLK_RcptLocalPartInvalid = yes

#-BLK: Header possui muitas linhas
BLK_HeaderLinesMax	= 125

#-BLK: Headers com enderecos invalidos (reply-to por exemplo)
BLK_HeadAddressInvalid	= yes

#-BLK: Headers com enderecos invalidos no campo TO, permitindo erros online ao enviar em paginas para enderecos incoretos
BLK_HeadAddressExternal	= yes

#-BLK: Helo nao enviado
BLK_HeloNotSend		= yes	

#-BLK: Reverso contem um host invalido, sem ter 2 pontos. Exemplo "localhost" ou "abc.br" (ou seja, um dominio siples)
BLK_ReversoInvalido	= yes

#-BLK: Reverso contem "adsl" e a validacao de Helo nao confere
BLK_HeloAdsl		= yes   

#-BLK: Verifica callout em Senders para relay hosts ou autenticados, verificando os...
BLK_SenderCalloutInt 	= yes

#-BLK: Verifica em Sender a existencia de usuarios locais, fazendo com que os erros de dominio invalido sejam ONLINE. Opcional, pois faz callout antes.
BLK_SenderVerifyInt	= yes

#-BLK: Nao permite verificacao de callout de apelidos (nao recomendado ativar)
#BLK_SenderCalloutAlias = yes

#-BLK: Verifica em Recipient a existencia de usuarios locais, fazendo que erros de dominio invalido sejam ONLINE
BLK_RecipientVerifyInt	= yes

#-BLK: Verifica Recipient, possibilitando verificacao callout de outros servidores...
BLK_RecipientVerifyExt	= yes

#-BLK: Verifica callout em Recipient para BACKUP, possibilitando verificacao callout de outros servidores...
BLK_RecipientCalloutBkp	= yes
BLK_UsePostmasterCalloutBkp = yes

#-BLK: Sender possui dominio local, mas envia remotamente sem autenticar-se ou ser SPF autorizado.
BLK_LocalExternal	= yes	

#-WRN: Verifica se heloname informado existe
WRN_Helo		= yes	

#-WRN: Verifica se existe dns reverso do ip que acessou
WRN_ReverseDNS		= yes

#-BLK: Auth nao e igual ao sender
BLK_AuthNotSender	= yes

#-BLK: Porta 25 nao recebe emails autenticados
BLK_AuthSpecificPort 	= yes

#-BLK: Somente autentica se tiver dominio no id.
BLK_AuthOnlyDomain	= yes

#-DEF: Retorna erro temporario se o IP primario estiver UP via Ping, supostamente forcando a entrega neste MX
#DEF_IPisUP_Ping = MX_HOSTS
#-DEF: Retorna erro temporario se o MX primario estiver UP via Ping, supostamente forcando a entrega neste MX
#DEF_MXisUP_Ping = yes
#-DEF: Retorna erro temporario se o MX primario estiver UP via Callout, supostamente forcando a entrega neste MX
DEF_MXisUP_Callout = yes

#-BLK: Nega mensagem de si para si mesmo externamente sem ser autenticado ou ser SPF autorizado.
BLK_SelfToSelfExternal	= yes	

#-DEF: Muitos RCPTS errados e vindos de fora (nega o resto que falta enviar, evitando adivinhacoes de email)
DEF_MoreDefers		= 3

#-BLK: Verifica existecia do Cabecalho Date
BLK_NoHeaderDate	= yes	

#-BLK: Verifica existecia do Cabecalho Message-ID
# e tambem um dos headers X-Mailer ou User-Agent
BLK_NoHeaderMessageID	= yes	

#-BLK: Verifica sintaxe dos headers
BLK_HeaderSyntax	= yes	

#-WRN/BLK: Verifica pelo SPAM ASSASIN valor igual ou maior que (Valor multiplicado por 10 sempre)
BLK_Spamd		= yes
BLK_SpamAssassinLevel	= 90
BLK_SpamAssassinSize    = 1024k
WRN_SpamAssassinLevel	= 0 
WRN_SpamAssassinSize	= 1024k

#-BLK: Antivirus
#-Antivirus ClamD
#av_scanner = clamd:/var/run/clamav/clamd.ctl
#dpkg-reconfigure clamav-base
#av_scanner = clamd:127.0.0.1 3310
#-Anvirirus MCAFEE
#av_scanner = cmdline:/opt/mcafee/uvscan --mime --allole --secure --noboot -r %s:Found|password-protected:(?::Found |Found::|is)(password-protected|.+)
BLK_Avir 		= yes
CFG_Avir		= clamd:127.0.0.1 3310
SIZ_Avir		= 16M
EXT_Avir		= *

#-BLK: Nega mensagens quebradas em varias partes, tentando burlar a quota
BLK_MessageFragmented	= yes	

#-SKP: Aceita emails autenticados sem verificar adicionalmente o conteudo
SKP_AUTHMAILS		= yes

#-BLK: Nega arquivos em anexos zip com senha
BLK_ZipEncrypt		= yes

