#--[Qualidade de servico IMQ] (sX)
#Tipo   Iff     DevIN    DevOUT         #Comentario
#imq_A   ppp0    imq0     imq1           #Interface Externa (imq0 in, imq1 out)

#--[Roteamento e Mascaramento NAT e Router] (rE, rA, rC, rS)
#Tipo   IffSrc  IffOut  IffNat  Flag     #Comentario. A saida da rede Src pela interface Out deve sofrer Nat do ip da interface Nat. Flag = i interno, e externo, ie interno e externo 
rtr_E   -	eth1    eth1    e        #1) Rota Externa
rtr_E   -	eth2    eth2    e        #1) Rota Externa

rtr_A   eth0    eth1    eth1    ei       #2) Rota Administrativa: poderia ser "eth0 ppp0 ppp0"
rtr_A   eth0	eth2	eth2	ei	 #3) Rota Clientes ou rede de Clientes. Mascarar comunicacao da rede adm para ela...
rtr_C	eth2	eth2	eth2	ei	 #3) Clientes comuns, sem nat sem nada

