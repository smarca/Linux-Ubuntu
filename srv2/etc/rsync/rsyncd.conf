#
# /etc/rsyncd.conf
#
#Sincronizar arquivos
#rsync --password-file=/etc/rsync/pwd.bkup1 -a --ipv4 --recursive --perms --owner --group --times --sparse --delete bkup1@10.0.0.1::mail /srv/mail/ \
#      --log-format='%t : %o: %f : modif %M, perm %B, uid %U gid %G, size %l' >> /var/log/rsync.log 2>> /var/log/rsync.log &
#Outra maneira de sincronizar ftp remoto
# rsync -rzua -vv --delete rsync://ftp.unicamp.br/ftp/pub/Conectiva/10 /opt/pub/Conectiva/

# Permissao do RSync
uid=root
gid=root

# Evitar mudanca de diretorio. Cuidado, pois nao mapeia uid e gid, apenas copia numericamente.
# Atencao: com o chroot eh necessario que os ids dos nomes e grupos coincidam em todas as maquinas (/etc/passwd e /etc/groups).
# exemplo: uid fulano = 1001 e gid users = 100, gid admin = 120 
use chroot = yes    

# Maximo de conexoes
max connections = 5

# Arquivo de log
log file = /var/log/rsync/rsyncd.log
#syslog facility = local5

# Usuario(s) autorizado(s) globalmente
secrets file = /etc/rsync/rsync.secrets
auth users = bkup1

# N incluir este mulo quando solicitada a listagem
list = false

# Log de Transfercias
transfer logging = yes
log format = : %h [%a]: %m %u: %o: %f : modif %M, perm %B, uid %U gid %G, size %l 

# Maquinas autorizadas globalmente
hosts allow = 10.0.0.1, 10.0.0.2

# Somente Leitura global
read only = true
write only = false

# Timeout
timeout	= 300

#-------------------------------------------------------------------
# Bkp
#-------------------------------------------------------------------
[bkpsys]
    path = /srv/bkp/srv2
    comment = Backup Configuracoes do Sistema SRV2
    auth users = bkup1
    read only = true
    refuse options = delete

#-------------------------------------------------------------------
# Email
#-------------------------------------------------------------------
[mail]
    path = /srv/mail/srv2
    comment = Email
    auth users = bkup1
    read only = true

#-------------------------------------------------------------------
# Programas
#-------------------------------------------------------------------
[prog]
    path = /srv/smb/prog
    comment = Programas
    auth users = bkup1
    read only = true
    exclude = /Suporte Thumbs.db
[bkpprog]
    path = /srv/smb/bkup/Suporte/srv2
    comment = Backup Programas SRV2
    auth users = bkup1
    read only = true




